<!DOCTYPE html>

<head>

<link rel="stylesheet" href="../assets/style.css">
<style>

  .ab-list { position: absolute; top: 110px; left: 16px; right: 16px; bottom: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

  .ab-row:last-child { border-bottom: none; }
  .ab-note { padding: 14px 16px; font-size: 11px; line-height: 1.5; color: var(--ink-secondary); }
</style>
</head>
<body>
<div class="screen" id="screen">
  <script src="../assets/scripts.js"></script>
  <script>
    const s = document.getElementById('screen');
    BO.initBackground(s, {decoCount:3});
    s.insertAdjacentHTML('beforeend', `
      <div class="ab-header">
        <div class="btn-icon small">←</div>
        <div class="title" style="flex:1;text-align:center">About</div>
        <div style="width:36px"></div>
      </div>
      <div class="ab-list">
        <div class="ab-group">
          <div class="ab-row"><span class="body">Privacy Policy</span><span class="caption">></span></div>

        <div class="ab-group">

          </div>
        </div>
      </div>
    `);

</div>
</body>
</html>
