<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Empty State · C方案星形糖果可爱风</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .empty-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; text-align: center; }
  .empty-icon { width: 100px; height: 100px; border-radius: 50%; background: var(--bg-soft); border: 2px dashed var(--line-strong); display: flex; align-items: center; justify-content: center; font-size: 48px; }
</style>
</head>
<body>
<div class="screen" id="screen">
  <script src="../assets/scripts.js"></script>
  <script>
    const s = document.getElementById('screen');
    BO.initBackground(s, {decoCount:4});
    s.insertAdjacentHTML('beforeend', `
      <div class="empty-wrap">
        <div class="empty-icon">🍭</div>
        <div class="title mt-24">No Collection Yet</div>
        <div class="body mt-8">Clear levels to unlock sweet pictures for your gallery.</div>
        <div class="btn btn-primary mt-24">Start Playing</div>
      </div>
    `);
  </script>
</div>
</body>
</html>
