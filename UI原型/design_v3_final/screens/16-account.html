<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Account · C方案星形糖果可爱风</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .acc-header { position: absolute; top: 52px; left: 16px; right: 16px; display: flex; align-items: center; gap: 12px; }
  .acc-profile { position: absolute; top: 110px; left: 20px; right: 20px; padding: 24px; text-align: center; }
  .acc-avatar { width: 88px; height: 88px; border-radius: 50%; background: var(--bg-soft); border: 3px solid var(--brand-peach); margin: 0 auto 14px; display: flex; align-items: center; justify-content: center; font-size: 44px; }
  .sync-card { display: flex; align-items: center; gap: 12px; padding: 14px; margin-top: 16px; border-radius: 16px; background: rgba(126,217,166,0.12); }
  .acc-list { position: absolute; top: 340px; left: 16px; right: 16px; bottom: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .acc-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-radius: 16px; background: var(--bg-card); border: 1px solid var(--line-base); }
</style>
</head>
<body>
<div class="screen" id="screen">
  <script src="../assets/scripts.js"></script>
  <script>
    const s = document.getElementById('screen');
    BO.initBackground(s, {decoCount:3});
    s.insertAdjacentHTML('beforeend', `
      <div class="acc-header">
        <div class="btn-icon small">←</div>
        <div class="title" style="flex:1;text-align:center">Account</div>
        <div style="width:36px"></div>
      </div>
      <div class="card acc-profile">
        <div class="acc-avatar">😊</div>
        <div class="subtitle">Guest Player</div>
        <div class="caption mt-8">ID: 8X2K9L</div>
        <div class="sync-card">
          <span style="font-size:22px">☁️</span>
          <div class="grow" style="text-align:left">
            <div class="body">Cloud Sync</div>
            <div class="caption">Last sync: just now</div>
          </div>
          <span style="font-size:18px;color:var(--brand-mint)">✓</span>
        </div>
      </div>
      <div class="acc-list">
        <div class="acc-row"><span class="body">Link Email</span><span class="caption">></span></div>
        <div class="acc-row"><span class="body">Connect Google</span><span class="caption">></span></div>
        <div class="acc-row"><span class="body">Connect Apple</span><span class="caption">></span></div>
        <div class="acc-row"><span class="body">Log Out</span><span class="caption">></span></div>
      </div>
    `);
  </script>
</div>
</body>
</html>
