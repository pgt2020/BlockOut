<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Error State · C方案星形糖果可爱风</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .err-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; text-align: center; }
  .err-icon { width: 100px; height: 100px; border-radius: 50%; background: var(--bg-soft); border: 2px solid var(--brand-coral); display: flex; align-items: center; justify-content: center; font-size: 48px; }
</style>
</head>
<body>
<div class="screen" id="screen">
  <script src="../assets/scripts.js"></script>
  <script>
    const s = document.getElementById('screen');
    BO.initBackground(s, {decoCount:3});
    s.insertAdjacentHTML('beforeend', `
      <div class="err-wrap">
        <div class="err-icon">⚠️</div>
        <div class="title mt-24">Oops!</div>
        <div class="body mt-8">Network unstable. Failed to load level data.</div>
        <div class="btn btn-primary mt-24">Retry</div>
        <div class="btn btn-ghost mt-12">Contact Support</div>
      </div>
    `);
  </script>
</div>
</body>
</html>
