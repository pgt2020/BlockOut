<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Boosters · C方案星形糖果可爱风</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .boost-icon { width: 72px; height: 72px; border-radius: 24px; background: var(--bg-soft); border: 2px solid var(--line-base); margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 36px; }
  .sheet-title { text-align: center; }
  .option-row { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 14px; border-radius: 18px; border: 1.5px solid var(--line-base); background: var(--bg-soft); }
  .option-row.primary { border-color: var(--brand-peach); background: rgba(255,170,128,0.08); }
  .option-icon { width: 44px; height: 44px; border-radius: 14px; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .option-info { flex: 1; }
</style>
</head>
<body>
<div class="screen" id="screen">
  <script src="../assets/scripts.js"></script>
  <script>
    const s = document.getElementById('screen');
    BO.initBackground(s, {decoCount:3});
    BO.renderHUD(s, {hearts:3, coins:'3,000', progress:2});
    s.insertAdjacentHTML('beforeend', `
      <div class="overlay">
        <div class="sheet">
          <div class="sheet-handle"></div>
          <div class="boost-icon">💡</div>
          <div class="title sheet-title">Get a Hint?</div>
          <div class="body text-center mt-8">Highlights one movable tile</div>
          <div class="option-row primary">
            <div class="option-icon">▶</div>
            <div class="option-info">
              <div class="subtitle">Watch Ad</div>
              <div class="caption">Free · LevelPlay</div>
            </div>
          </div>
          <div class="option-row">
            <div class="option-icon">🪙</div>
            <div class="option-info">
              <div class="subtitle">Buy with Coins</div>
              <div class="caption">300 coins</div>
            </div>
          </div>
          <div class="btn btn-ghost w-full mt-16" style="border-color:var(--line-base); color:var(--ink-secondary)">Cancel</div>
        </div>
      </div>
    `);
  </script>
</div>
</body>
</html>
