<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Onboarding · C方案星形糖果可爱风</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .onb-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 60px 24px 24px; text-align: center; }
  .onb-card { padding: 24px; margin-top: 24px; }
  .onb-illust { width: 180px; height: 180px; border-radius: 32px; background: var(--bg-soft); margin: 0 auto 16px; border: 1px solid var(--line-base); display: flex; align-items: center; justify-content: center; font-size: 72px; }
  .onb-dots { display: flex; gap: 8px; margin-top: 20px; }
  .onb-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line-base); }
  .onb-dot.active { background: var(--brand-peach); }
  .onb-actions { position: absolute; bottom: 40px; left: 24px; right: 24px; display: flex; gap: 12px; }
</style>
</head>
<body>
<div class="screen" id="screen">
  <script src="../assets/scripts.js"></script>
  <script>
    const s = document.getElementById('screen');
    BO.initBackground(s, {decoCount:4});
    s.insertAdjacentHTML('beforeend', `
      <div class="onb-wrap">
        <div class="card onb-card">
          <div class="onb-illust">👆</div>
          <div class="title">Tap to Fly</div>
          <div class="body mt-12">Tap a tile with an arrow. If the path is clear, the whole piece flies out!</div>
        </div>
        <div class="onb-dots">
          <div class="onb-dot active"></div>
          <div class="onb-dot"></div>
          <div class="onb-dot"></div>
        </div>
        <div class="onb-actions">
          <div class="btn btn-ghost" style="flex:1">Skip</div>
          <div class="btn btn-primary" style="flex:1.5">Next</div>
        </div>
      </div>
    `);
  </script>
</div>
</body>
</html>
