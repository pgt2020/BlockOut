<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Loading · C方案星形糖果可爱风</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .load-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .load-logo { width: 120px; height: 120px; border-radius: 32px; background: linear-gradient(180deg,var(--brand-peach),var(--brand-coral)); display: flex; align-items: center; justify-content: center; font-size: 56px; box-shadow: 0 12px 32px rgba(255,122,107,0.28); }
  .load-title { margin-top: 24px; }
  .load-bar { width: 200px; margin-top: 16px; }
  .load-text { margin-top: 10px; }
</style>
</head>
<body>
<div class="screen" id="screen">
  <script src="../assets/scripts.js"></script>
  <script>
    const s = document.getElementById('screen');
    BO.initBackground(s, {decoCount:4});
    s.insertAdjacentHTML('beforeend', `
      <div class="load-wrap">
        <div class="load-logo">⭐</div>
        <div class="display load-title">BlockOut</div>
        <div class="progress load-bar"><div class="progress-fill" style="width:62%"></div></div>
        <div class="caption load-text">Loading level assets...</div>
      </div>
    `);
  </script>
</div>
</body>
</html>
