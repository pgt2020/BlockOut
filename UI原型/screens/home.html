<!doctype html><html lang="zh"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%}
body{background:#E9EDF2;display:flex;align-items:center;justify-content:center;font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
.phone{width:390px;height:844px;background:#0E1116;border-radius:46px;padding:11px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.screen{width:100%;height:100%;background:#F7F9FC;border-radius:36px;overflow:hidden;position:relative;display:flex;flex-direction:column;color:#1F2733}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:130px;height:28px;background:#0E1116;border-radius:0 0 18px 18px;z-index:60}
.sb{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:700;color:#1F2733;z-index:5;margin-top:6px}
.sb .r{display:flex;gap:5px;align-items:center}.sb .d{width:6px;height:6px;border-radius:50%;background:#1F2733}
.head{display:flex;align-items:center;justify-content:space-between;padding:6px 24px 0}
.logo{font-weight:900;letter-spacing:2px;font-size:22px;color:#1F2733}.logo b{color:#1FB6A6}
.gear{width:38px;height:38px;border-radius:12px;background:#fff;border:1px solid #D7DCE3;display:flex;align-items:center;justify-content:center;font-size:18px}
.hero{margin:18px 22px 0;background:#fff;border:1px solid #E3E8EF;border-radius:20px;padding:14px;box-shadow:0 6px 20px rgba(20,40,80,.05)}
.hero .pic{height:150px;border-radius:14px;background:linear-gradient(135deg,#FFB36B,#FF7A45 40%,#7C5CFC 100%);position:relative;overflow:hidden}
.hero .pic .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.25) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.25) 1px,transparent 1px);background-size:30px 30px}
.hero .pic .done{position:absolute;right:0;bottom:0;width:62%;height:62%;background:#fff;opacity:.92;border-top-left-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px}
.hero .cap{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.hero .cap .t{font-weight:800;font-size:15px}.hero .cap .s{font-size:12px;color:#8A93A2}
.btns{margin:18px 22px 0;display:flex;flex-direction:column;gap:12px}
.btn{height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;border:1px solid #D7DCE3;background:#fff;color:#1F2733}
.btn.primary{background:linear-gradient(135deg,#1FB6A6,#12A08F);color:#fff;border:none;box-shadow:0 8px 20px rgba(31,182,166,.35)}
.btn.ghost{background:#EEF3F6;color:#1F2733}
.bar{margin:auto 22px 18px;display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid #E3E8EF;border-radius:16px;padding:10px 16px}
.bar .c{display:flex;align-items:center;gap:8px;font-weight:800}.bar .ic{display:flex;gap:10px;font-size:20px}
.pill{position:absolute;background:rgba(31,182,166,.14);border:1px solid #1FB6A6;color:#0E7C70;font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;z-index:40;display:flex;align-items:center;gap:5px}
.pill .n{background:#1FB6A6;color:#fff;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px}
.foot{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:10px;color:#A9B2BF;letter-spacing:.5px}
</style></head><body><div class="phone"><div class="screen">
<div class="notch"></div>
<div class="sb"><span>9:41</span><span class="r"><span class="d"></span><span class="d"></span><span class="d"></span></span></div>
<div class="head"><div class="logo">BLOCK<b>OUT</b></div><div class="gear">⚙</div></div>
<div class="hero">
  <div class="pic"><div class="grid"></div><div class="done">🖼️</div></div>
  <div class="cap"><div class="t">新展厅 · 霓虹都市</div><div class="s">8 / 12 拼装中</div></div>
</div>
<div class="btns">
  <div class="btn primary">继续 · 第 6 章</div>
  <div class="btn ghost">世界展厅</div>
  <div class="btn ghost">每日挑战</div>
</div>
<div class="bar"><div class="c">🪙 1,280</div><div class="ic">💡 🔨 🪄</div></div>
<div class="pill" style="left:24px;top:300px"><span class="n">②</span>可缩放世界画布入口</div>
<div class="foot">BlockOut UI 原型 · 创新结构 v0.1 — 首页 / 主菜单</div>
</div></div></body></html>
