<!doctype html><html lang="zh"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%}
body{background:#E9EDF2;display:flex;align-items:center;justify-content:center;font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
.phone{width:390px;height:844px;background:#0E1116;border-radius:46px;padding:11px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.screen{width:100%;height:100%;background:#0B1020;border-radius:36px;overflow:hidden;position:relative;display:flex;flex-direction:column;color:#EAF0F7}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:130px;height:28px;background:#0E1116;border-radius:0 0 18px 18px;z-index:60}
.sb{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:700;color:#EAF0F7;z-index:5;margin-top:6px}
.sb .r{display:flex;gap:5px;align-items:center}.sb .d{width:6px;height:6px;border-radius:50%;background:#EAF0F7}
.head{display:flex;align-items:center;justify-content:center;padding:8px 0 0;font-weight:800;font-size:15px;color:#CFE9E4}
.art{margin:14px 26px 0;flex:1;border-radius:22px;background:linear-gradient(135deg,#FFB36B,#FF7A45 35%,#7C5CFC 100%);position:relative;overflow:hidden;box-shadow:0 18px 50px rgba(124,92,252,.35)}
.art .frame{position:absolute;inset:10px;border:3px solid rgba(255,255,255,.85);border-radius:16px}
.art .shine{position:absolute;inset:0;background:linear-gradient(120deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%)}
.art .cap{position:absolute;left:18px;bottom:16px;font-weight:800;font-size:16px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.stars{position:absolute;top:18px;left:0;right:0;display:flex;justify-content:center;gap:10px;font-size:26px;z-index:5}
.meta{margin:16px 26px 0;display:flex;justify-content:space-around;text-align:center}
.meta .m .v{font-weight:900;font-size:20px;color:#1FB6A6}.meta .m .k{font-size:11px;color:#9FB0C7}
.swipe{margin:18px 26px 0;height:54px;border-radius:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;color:#EAF0F7;font-size:15px}
.swipe .ar{font-size:20px;animation:up 1.4s infinite}
@keyframes up{0%,100%{transform:translateY(4px);opacity:.5}50%{transform:translateY(-4px);opacity:1}}
.foot{margin-top:auto;padding:12px 22px;font-size:10px;color:#7E8AA0;text-align:center;letter-spacing:.5px}
.pill{position:absolute;background:rgba(31,182,166,.95);border:1px solid #fff;color:#04211D;font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;z-index:40;display:flex;align-items:center;gap:5px}
.pill .n{background:#04211D;color:#9CF;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px}
</style></head><body><div class="phone"><div class="screen">
<div class="notch"></div>
<div class="sb"><span>9:41</span><span class="r"><span class="d"></span><span class="d"></span><span class="d"></span></span></div>
<div class="head">第 6 章 · 完成拼装</div>
<div class="art"><div class="frame"></div><div class="shine"></div><div class="cap">霓虹都市</div></div>
<div class="stars">⭐ ⭐ ⭐</div>
<div class="meta"><div class="m"><div class="v">24</div><div class="k">步数</div></div><div class="m"><div class="v">×3</div><div class="k">最高连击</div></div><div class="m"><div class="v">+120</div><div class="k">金币</div></div></div>
<div class="swipe"><span class="ar">↑</span> 上滑继续 <span class="ar">↑</span></div>
<div class="pill" style="left:18px;top:96px"><span class="n">④</span>无弹窗 · 棋盘morph成作品</div>
<div class="foot">BlockOut UI 原型 · 创新结构 v0.1 — 情境化无弹窗结算</div>
</div></div></body></html>
