<!doctype html><html lang="zh"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%}
body{background:#E9EDF2;display:flex;align-items:center;justify-content:center;font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
.phone{width:390px;height:844px;background:#0E1116;border-radius:46px;padding:11px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.screen{width:100%;height:100%;background:#0B1020;border-radius:36px;overflow:hidden;position:relative;display:flex;flex-direction:column;color:#EAF0F7}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:130px;height:28px;background:#0E1116;border-radius:0 0 18px 18px;z-index:60}
.sb{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:700;color:#EAF0F7;z-index:5;margin-top:6px}
.sb .r{display:flex;gap:5px;align-items:center}.sb .d{width:6px;height:6px;border-radius:50%;background:#EAF0F7}
.head{display:flex;align-items:center;gap:10px;padding:10px 22px 0;color:#EAF0F7;font-weight:800;font-size:17px}
.head .bk{font-size:20px;color:#9FB0C7}
.head small{font-weight:600;font-size:12px;color:#7E8AA0}
.grid{margin:14px 18px 0;display:grid;grid-template-columns:repeat(2,1fr);gap:14px;overflow:auto}
.card{border-radius:16px;overflow:hidden;background:#11182E;border:1px solid rgba(255,255,255,.1);position:relative}
.card .img{height:120px;background:linear-gradient(135deg,#FFB36B,#FF7A45 35%,#7C5CFC)}
.card .img.b2{background:linear-gradient(135deg,#7C5CFC,#3FA9F5)}
.card .img.b3{background:linear-gradient(135deg,#36C18B,#1FB6A6)}
.card .img.b4{background:linear-gradient(135deg,#FFD36B,#FF7A45)}
.card .img.lock{background:#1A2238;display:flex;align-items:center;justify-content:center;font-size:26px;color:#4A5872}
.card .lab{position:absolute;left:8px;bottom:6px;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.card .star{position:absolute;right:8px;top:6px;font-size:12px;color:#FFD36B}
.foot{margin-top:auto;padding:12px 22px;font-size:10px;color:#7E8AA0;text-align:center;letter-spacing:.5px}
.pill{position:absolute;background:rgba(255,122,69,.95);border:1px solid #fff;color:#3A1500;font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;z-index:40;display:flex;align-items:center;gap:5px}
.pill .n{background:#3A1500;color:#FFD9C2;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px}
</style></head><body><div class="phone"><div class="screen">
<div class="notch"></div>
<div class="sb"><span>9:41</span><span class="r"><span class="d"></span><span class="d"></span><span class="d"></span></span></div>
<div class="head"><span class="bk">‹</span>收藏展厅 <small>展厅嵌于世界画布内</small></div>
<div class="grid">
  <div class="card"><div class="img"></div><span class="star">⭐⭐⭐</span><span class="lab">第 1 章 · 晨曦</span></div>
  <div class="card"><div class="img b2"></div><span class="star">⭐⭐⭐</span><span class="lab">第 2 章 · 深海</span></div>
  <div class="card"><div class="img b3"></div><span class="star">⭐⭐</span><span class="lab">第 3 章 · 森林</span></div>
  <div class="card"><div class="img b4"></div><span class="star">⭐⭐⭐</span><span class="lab">第 4 章 · 黄昏</span></div>
  <div class="card"><div class="img lock">🔒</div><span class="lab">第 5 章</span></div>
  <div class="card"><div class="img lock">🔒</div><span class="lab">第 6 章</span></div>
</div>
<div class="pill" style="right:16px;top:96px"><span class="n">②</span>收藏即展厅 · 取消独立页</div>
<div class="foot">BlockOut UI 原型 · 创新结构 v0.1 — 图集 / 收藏展厅</div>
</div></div></body></html>
