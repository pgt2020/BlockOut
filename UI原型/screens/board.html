<!doctype html><html lang="zh"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%}
body{background:#E9EDF2;display:flex;align-items:center;justify-content:center;font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
.phone{width:390px;height:844px;background:#0E1116;border-radius:46px;padding:11px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.screen{width:100%;height:100%;background:#EEF2F7;border-radius:36px;overflow:hidden;position:relative;display:flex;flex-direction:column;color:#1F2733}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:130px;height:28px;background:#0E1116;border-radius:0 0 18px 18px;z-index:60}
.sb{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:700;color:#1F2733;z-index:5;margin-top:6px}
.sb .r{display:flex;gap:5px;align-items:center}.sb .d{width:6px;height:6px;border-radius:50%;background:#1F2733}
.hud{margin:4px 16px 0;display:flex;align-items:center;justify-content:space-between}
.hud .lv{font-weight:900;font-size:15px}.hud .pause{width:34px;height:34px;border-radius:10px;background:#fff;border:1px solid #D7DCE3;display:flex;align-items:center;justify-content:center}
.ass{margin:8px 16px 0;background:#fff;border:1px solid #E3E8EF;border-radius:14px;padding:8px 12px}
.ass .top{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:#0E7C70;margin-bottom:6px}
.ass .bar{height:9px;background:#E3E8EF;border-radius:999px;overflow:hidden;display:flex;gap:2px}
.ass .bar i{flex:1;background:#E3E8EF;border-radius:2px}.ass .bar i.on{background:linear-gradient(90deg,#1FB6A6,#FF7A45)}
.sub{margin:8px 16px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:#5C6B82}
.sub .timer{color:#1F2733}.sub .combo{color:#FF7A45}
/* board: rectangular coordinate grid (dot matrix) as background, but piece footprint is a polygon */
.board{margin:8px 16px 0;flex:1;position:relative;background:#F3F6FA;border:1px solid #D7DCE3;border-radius:18px;overflow:hidden;
  background-image:radial-gradient(rgba(31,182,166,.16) 1.4px,transparent 1.6px);background-size:40px 40px;background-position:10px 10px}
.piece{position:absolute;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#1F2733;box-shadow:0 3px 8px rgba(20,40,80,.08);border:1px solid #CFD6DF}
.piece.go{background:linear-gradient(135deg,#Dff7F2,#Bfe9e0);border-color:#7FD3C4;color:#0E7C70;box-shadow:0 0 0 3px rgba(31,182,166,.18)}
.piece.bad{background:linear-gradient(135deg,#FFE6E6,#FFD2D2);border-color:#FF9B9B;color:#C0392B;box-shadow:0 0 0 3px rgba(255,90,90,.16)}
.launch{position:absolute;border:2px dashed #1FB6A6;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#1FB6A6;opacity:.5}
/* polygon picture silhouette inset (revealed only on win / collection) */
.pic{position:absolute;right:10px;top:8px;width:74px;height:74px;background:rgba(11,16,32,.06);border:1px dashed #9AA6B5;border-radius:10px;padding:6px;z-index:30}
.pic .ttl{font-size:8px;font-weight:800;color:#5C6B82;margin-bottom:3px}
.pic .grid{display:grid;grid-template-columns:repeat(8,1fr);grid-auto-rows:6px;gap:1px}
.pic .grid b{background:transparent}.pic .grid b.f{background:#FF7A45;border-radius:1px}
.tools{margin:8px 18px 0;display:flex;align-items:center;justify-content:space-around;background:#fff;border:1px solid #E3E8EF;border-radius:16px;padding:10px 0}
.tools .t{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:#5C6B82}
.tools .t .ic{width:38px;height:38px;border-radius:12px;background:#EEF3F6;display:flex;align-items:center;justify-content:center;font-size:18px}
.foot{margin-top:auto;padding:10px 22px;font-size:10px;color:#A9B2BF;text-align:center;letter-spacing:.5px}
.pill{position:absolute;background:rgba(31,182,166,.92);border:1px solid #fff;color:#04211D;font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;z-index:40;display:flex;align-items:center;gap:5px;max-width:230px;line-height:1.25}
.pill .n{background:#04211D;color:#9CF;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;flex:none}
.pill.o{background:rgba(255,122,69,.92);color:#3A1500}.pill.o .n{background:#3A1500;color:#FFD9C2}
.legend{position:absolute;left:8px;bottom:8px;background:rgba(11,16,32,.82);color:#fff;border-radius:10px;padding:7px 10px;font-size:10px;line-height:1.6;z-index:38;max-width:300px}
.legend b{color:#9CF}
</style></head><body><div class="phone"><div class="screen">
<div class="notch"></div>
<div class="sb"><span>9:41</span><span class="r"><span class="d"></span><span class="d"></span><span class="d"></span></span></div>
<div class="hud"><div class="lv">6 - 8</div><div class="pause">⏸</div></div>
<div class="ass"><div class="top"><span>③ 章节拼装进度（元进度）</span><span>8 / 12</span></div>
  <div class="bar"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i></div></div>
<div class="sub"><span class="timer">⏱ 00:24</span><span class="combo">连击 ×3</span><span>剩余 21 块</span></div>
<div class="board">
  <!-- polygon picture silhouette inset -->
  <div class="pic"><div class="ttl">图集剪影(多边形)</div>
    <div class="grid">
      <b></b><b></b><b class="f"></b><b class="f"></b><b class="f"></b><b class="f"></b><b class="f"></b><b class="f"></b>
      <b></b><b class="f"></b><b class="f"></b><b class="f"></b><b class="f"></b><b class="f"></b><b class="f"></b><b class="f"></b>
      <b></b><b class="f"></b><b class="f"></b><b></b><b></b><b class="f"></b><b class="f"></b><b class="f"></b>
      <b class="f"></b><b class="f"></b><b class="f"></b><b class="f"></b><b class="f"></b><b class="f"></b><b class="f"></b><b class="f"></b>
      <b class="f"></b><b class="f"></b><b class="f"></b><b></b><b></b><b class="f"></b><b class="f"></b><b class="f"></b>
      <b></b><b class="f"></b><b class="f"></b><b class="f"></b><b class="f"></b><b class="f"></b><b class="f"></b><b class="f"></b>
      <b></b><b class="f"></b><b class="f"></b><b class="f"></b><b class="f"></b><b class="f"></b><b class="f"></b><b class="f"></b>
      <b></b><b></b><b class="f"></b><b class="f"></b><b class="f"></b><b class="f"></b><b></b><b></b>
    </div>
  </div>
  <!-- piece footprint = NON-RECTANGULAR POLYGON (with gaps), over rectangular dot grid -->
  <!-- row0 cols2-5 -->
  <div class="piece go" style="left:90px;top:10px;width:158px;height:38px">▲</div>
  <!-- row1 cols1-3 / cols4-6 -->
  <div class="piece bad" style="left:50px;top:50px;width:118px;height:38px">▶</div>
  <div class="piece go" style="left:170px;top:50px;width:118px;height:38px">▼</div>
  <!-- row2 cols1-2 (gap col3) cols4-5 -->
  <div class="piece" style="left:50px;top:90px;width:78px;height:38px">▶</div>
  <div class="piece go" style="left:170px;top:90px;width:78px;height:38px">▶</div>
  <!-- row3 cols0-3 / cols4-7 -->
  <div class="piece bad" style="left:10px;top:130px;width:158px;height:38px">◀</div>
  <div class="piece go" style="left:170px;top:130px;width:158px;height:38px">▶</div>
  <!-- row4 cols0-2 (gap 3-4) cols5-7 -->
  <div class="piece go" style="left:10px;top:170px;width:118px;height:38px">▲</div>
  <div class="piece bad" style="left:210px;top:170px;width:118px;height:38px">▶</div>
  <!-- row5 cols1-3 / cols4-6 -->
  <div class="piece" style="left:50px;top:210px;width:118px;height:38px">◀</div>
  <div class="piece go" style="left:170px;top:210px;width:118px;height:38px">▼</div>
  <!-- row6 cols1-2 / cols3-6 -->
  <div class="piece" style="left:50px;top:250px;width:78px;height:38px">▶</div>
  <div class="piece go" style="left:130px;top:250px;width:158px;height:38px">◀</div>
  <!-- row7 cols2-5 -->
  <div class="piece go" style="left:90px;top:290px;width:158px;height:38px">▼</div>
  <!-- row8 cols3-4 -->
  <div class="piece go" style="left:130px;top:330px;width:78px;height:38px">▲</div>
  <div class="launch" style="left:330px;top:10px;width:40px;height:38px">💨</div>
  <div class="legend"><b>真实机制</b>：坐标系=矩形点阵（灰点）；块足迹=<b>多边形</b>（带空洞，非实心矩形）。点块→沿箭头到<b>棋盘边界</b>路径畅通则整块飞出。<br><span style="color:#7CF">绿=可飞</span> · <span style="color:#FF9B9B">红=被挡(错误)</span> · 游玩中<b>不显图</b>；图集=右上角多边形剪影，仅通关/收藏页展全。</div>
</div>
<div class="tools">
  <div class="t"><div class="ic">💡</div>提示</div>
  <div class="t"><div class="ic">🔨</div>锤子</div>
  <div class="t"><div class="ic">🪄</div>魔法棒</div>
  <div class="t"><div class="ic">↩</div>撤销</div>
</div>
<div class="pill" style="left:16px;top:120px"><span class="n">①</span>块足迹=多边形(有空格洞)</div>
<div class="pill o" style="right:10px;top:240px"><span class="n">①</span>图集=多边形剪影·仅通关显</div>
<div class="foot">BlockOut UI 原型 · 忠于真实机制 v0.3 — 关卡内棋盘（非矩形足迹）</div>
</div></div></body></html>
