<!doctype html><html lang="zh"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%}
body{background:#E9EDF2;display:flex;align-items:center;justify-content:center;font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
.phone{width:390px;height:844px;background:#0E1116;border-radius:46px;padding:11px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.screen{width:100%;height:100%;background:#F7F9FC;border-radius:36px;overflow:hidden;position:relative;display:flex;flex-direction:column;color:#1F2733}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:130px;height:28px;background:#0E1116;border-radius:0 0 18px 18px;z-index:60}
.sb{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:700;color:#1F2733;z-index:5;margin-top:6px}
.sb .r{display:flex;gap:5px;align-items:center}.sb .d{width:6px;height:6px;border-radius:50%;background:#1F2733}
.head{display:flex;align-items:center;gap:12px;padding:10px 22px 0}
.head .bk{font-size:22px;color:#8A93A2}.head .t{font-weight:800;font-size:18px}
.head .t small{display:block;font-size:12px;color:#8A93A2;font-weight:600}
.prog{margin:12px 22px 0;height:10px;background:#E3E8EF;border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;width:66%;background:linear-gradient(90deg,#1FB6A6,#FF7A45)}
.prog-lab{margin:6px 22px 0;font-size:12px;color:#8A93A2;font-weight:600}
.grid{margin:16px 18px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.lv{aspect-ratio:1;border-radius:18px;background:#fff;border:1px solid #E3E8EF;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;box-shadow:0 4px 14px rgba(20,40,80,.04)}
.lv .pc{width:46px;height:46px;border-radius:10px;background:linear-gradient(135deg,#CFE9E4,#9FD8CF)}
.lv .no{position:absolute;top:8px;left:10px;font-size:12px;font-weight:800;color:#8A93A2}
.lv.done .pc{background:linear-gradient(135deg,#1FB6A6,#12A08F)}
.lv.done .no{color:#0E7C70}
.lv.cur{border:2px solid #1FB6A6;box-shadow:0 0 0 4px rgba(31,182,166,.18)}
.lv.cur .pc{background:linear-gradient(135deg,#FFB36B,#FF7A45)}
.lv.lock{opacity:.55}.lv.lock .pc{background:#E8ECF1}.lv.lock .no{color:#B7BFCB}
.lv.lock::after{content:"🔒";position:absolute;font-size:18px}
.foot{margin-top:auto;padding:14px 22px;font-size:10px;color:#A9B2BF;text-align:center;letter-spacing:.5px}
.pill{position:absolute;background:rgba(255,122,69,.14);border:1px solid #FF7A45;color:#C7521E;font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;z-index:40;display:flex;align-items:center;gap:5px}
.pill .n{background:#FF7A45;color:#fff;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px}
</style></head><body><div class="phone"><div class="screen">
<div class="notch"></div>
<div class="sb"><span>9:41</span><span class="r"><span class="d"></span><span class="d"></span><span class="d"></span></span></div>
<div class="head"><div class="bk">‹</div><div class="t">第 6 章 · 霓虹都市<small>8 / 12 拼装完成</small></div></div>
<div class="prog"><i></i></div><div class="prog-lab">章节整体拼装进度</div>
<div class="grid">
  <div class="lv done"><span class="no">1</span><div class="pc"></div></div>
  <div class="lv done"><span class="no">2</span><div class="pc"></div></div>
  <div class="lv done"><span class="no">3</span><div class="pc"></div></div>
  <div class="lv done"><span class="no">4</span><div class="pc"></div></div>
  <div class="lv done"><span class="no">5</span><div class="pc"></div></div>
  <div class="lv done"><span class="no">6</span><div class="pc"></div></div>
  <div class="lv done"><span class="no">7</span><div class="pc"></div></div>
  <div class="lv cur"><span class="no">8</span><div class="pc"></div></div>
  <div class="lv"><span class="no">9</span><div class="pc"></div></div>
  <div class="lv"><span class="no">10</span><div class="pc"></div></div>
  <div class="lv lock"><span class="no">11</span><div class="pc"></div></div>
  <div class="lv lock"><span class="no">12</span><div class="pc"></div></div>
</div>
<div class="pill" style="right:20px;top:150px"><span class="n">③</span>章节拼装进度可见</div>
<div class="foot">BlockOut UI 原型 · 创新结构 v0.1 — 选关 / 章节内</div>
</div></div></body></html>
