<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><style>
* { margin:0; padding:0; box-sizing:border-box; font-family:"Segoe UI",-apple-system,"PingFang SC",sans-serif; }
body { background:#000; display:flex; justify-content:center; align-items:center; min-height:100vh; }
.phone { width:390px; height:844px; background:#050508; border-radius:44px; position:relative; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,.8); border:1px solid #1a1a25; }
.sb { height:44px; display:flex; justify-content:space-between; align-items:center; padding:0 26px; color:#6f6f8a; font-size:13px; font-weight:600; }
.sb .icons { letter-spacing:2px; }
.hud { display:flex; justify-content:space-between; align-items:center; padding:6px 22px 14px; }
.hud .lvl { color:#e8e8ff; font-size:14px; font-weight:700; text-shadow:0 0 12px rgba(120,180,255,.5); }
.hud .lvl small { color:#5a5a7a; font-weight:500; font-size:11px; }
.hud .right { display:flex; gap:10px; }
.chip { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); color:#9a9ac0; padding:8px 13px; border-radius:14px; font-size:13px; font-weight:600; }
.chip.t { color:#7af0ff; text-shadow:0 0 10px rgba(120,240,255,.6); }
.chip.h { color:#ff7aa8; text-shadow:0 0 10px rgba(255,120,168,.6); }
.boardwrap { display:flex; justify-content:center; margin-top:6px; }
.board { width:330px; height:330px; background:radial-gradient(circle at 50% 40%,#0c0c18,#050508); border-radius:26px; position:relative; box-shadow:inset 0 0 0 1px rgba(255,255,255,.06), 0 0 40px rgba(80,120,255,.08); }
.dots { position:absolute; inset:18px; display:grid; grid-template-columns:repeat(9,1fr); grid-template-rows:repeat(9,1fr); }
.dots i { width:2px; height:2px; background:#1c1c30; border-radius:50%; align-self:center; justify-self:center; }
/* neon arrow blocks, color-grouped (cyan/magenta/lime/yellow) */
.block { position:absolute; border-radius:13px; background:rgba(255,255,255,.03); display:flex; align-items:center; justify-content:center; box-shadow:inset 0 0 0 1px rgba(255,255,255,.05); }
.block .arrow { font-size:40px; font-weight:900; line-height:1; }
.c-cyan .arrow { color:#3df0ff; text-shadow:0 0 14px #3df0ff,0 0 28px rgba(61,240,255,.6); }
.c-mag .arrow { color:#ff4 fd6; color:#ff4fd6; text-shadow:0 0 14px #ff4fd6,0 0 28px rgba(255,79,214,.6); }
.c-lime .arrow { color:#9dff4f; text-shadow:0 0 14px #9dff4f,0 0 28px rgba(157,255,79,.6); }
.c-yel .arrow { color:#ffd84f; text-shadow:0 0 14px #ffd84f,0 0 28px rgba(255,216,79,.6); }
.b1 { left:18px; top:18px; width:138px; height:64px; } .b2 { left:160px; top:18px; width:64px; height:138px; }
.b3 { left:228px; top:18px; width:64px; height:64px; } .b4 { left:18px; top:86px; width:64px; height:64px; }
.b5 { left:86px; top:86px; width:64px; height:64px; } .b6 { left:228px; top:86px; width:64px; height:138px; }
.b7 { left:18px; top:154px; width:138px; height:64px; } .b8 { left:86px; top:154px; width:64px; height:64px; }
.b9 { left:160px; top:160px; width:64px; height:64px; } .b10 { left:228px; top:228px; width:64px; height:64px; }
.tools { display:flex; justify-content:center; gap:14px; margin-top:22px; }
.tool { width:58px; height:58px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); border-radius:18px; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#9a9ac0; font-size:11px; font-weight:600; }
.tool .ic { font-size:22px; margin-bottom:2px; }
.tool.t1 { color:#3df0ff; box-shadow:0 0 16px rgba(61,240,255,.25); }
.tool.t3 { color:#ffd84f; box-shadow:0 0 16px rgba(255,216,79,.2); }
.progress { margin:18px 40px 0; height:8px; background:rgba(255,255,255,.05); border-radius:6px; overflow:hidden; }
.progress > div { width:62%; height:100%; background:linear-gradient(90deg,#3df0ff,#ff4fd6); border-radius:6px; box-shadow:0 0 12px rgba(61,240,255,.5); }
.ptxt { text-align:center; color:#5a5a7a; font-size:11px; margin-top:7px; }
.cap { position:absolute; bottom:0; width:100%; background:linear-gradient(0deg,rgba(0,0,0,.95),rgba(0,0,0,0)); padding:30px 20px 14px; }
.cap .t { color:#fff; font-size:13px; font-weight:700; }
.cap .d { color:#8a8aa8; font-size:11px; line-height:1.5; margin-top:3px; }
</style></head><body>
