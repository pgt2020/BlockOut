<!doctype html><html lang="zh"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%}
body{background:#0b0e13;display:flex;align-items:center;justify-content:center;font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
.phone{width:390px;height:844px;background:#05070A;border-radius:46px;padding:11px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.screen{width:100%;height:100%;background:#0E1116;border-radius:36px;overflow:hidden;position:relative;display:flex;flex-direction:column;color:#F3ECE0}
/* chapter ambient glow (warm gold = chapter 5 城市黄昏, demonstrates 换皮) */
.screen::before{content:"";position:absolute;top:-80px;right:-60px;width:340px;height:300px;background:radial-gradient(circle,rgba(232,162,75,.20),transparent 70%);pointer-events:none}
.screen::after{content:"";position:absolute;bottom:-90px;left:-70px;width:320px;height:300px;background:radial-gradient(circle,rgba(214,92,55,.16),transparent 70%);pointer-events:none}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:130px;height:28px;background:#05070A;border-radius:0 0 18px 18px;z-index:60}
.sb{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:700;color:#F3ECE0;z-index:5;margin-top:6px;position:relative}
.sb .r{display:flex;gap:5px;align-items:center}.sb .d{width:6px;height:6px;border-radius:50%;background:#F3ECE0}
.hud{margin:6px 18px 0;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:3}
.hud .lv{display:flex;flex-direction:column}.hud .lv b{font-weight:900;font-size:17px}.hud .lv span{font-size:10px;color:#D9B98C;font-weight:800;letter-spacing:1px}
.hud .pause{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(232,162,75,.35);display:flex;align-items:center;justify-content:center;font-size:15px;color:#F3ECE0;backdrop-filter:blur(6px)}
.ass{margin:10px 18px 0;background:rgba(255,255,255,.05);border:1px solid rgba(232,162,75,.30);border-radius:14px;padding:10px 14px;position:relative;z-index:3;backdrop-filter:blur(8px)}
.ass .top{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:#E8A24B;margin-bottom:7px;letter-spacing:.3px}
.ass .bar{height:9px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;display:flex;gap:2px}
.ass .bar i{flex:1;background:rgba(255,255,255,.08);border-radius:2px}.ass .bar i.on{background:linear-gradient(90deg,#E8A24B,#F0C46B)}
.sub{margin:9px 18px 0;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;position:relative;z-index:3}
.sub .timer{color:#F3ECE0;font-variant-numeric:tabular-nums}.sub .combo{color:#F0C46B}.sub .left{color:#C9B79C}
.board{margin:10px 18px 0;flex:1;position:relative;background:rgba(255,255,255,.04);border:1px solid rgba(232,162,75,.22);border-radius:18px;overflow:hidden;
  background-image:radial-gradient(rgba(232,162,75,.14) 1.3px,transparent 1.5px);background-size:40px 40px;background-position:10px 10px}
/* frosted glass pieces, accent = chapter gold */
.piece{position:absolute;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:700;backdrop-filter:blur(4px)}
.piece.go{background:linear-gradient(160deg,rgba(232,162,75,.22),rgba(232,162,75,.08));border:1.5px solid rgba(240,196,107,.85);color:#F7DDA0;box-shadow:0 0 16px rgba(232,162,75,.22)}
.piece.bad{background:linear-gradient(160deg,rgba(192,57,43,.26),rgba(192,57,43,.10));border:1.5px solid #E8766A;color:#FF9C8E}
.piece.neu{background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.14);color:#B9A98E}
.tools{margin:10px 18px 0;display:flex;align-items:center;justify-content:space-around;background:rgba(255,255,255,.05);border:1px solid rgba(232,162,75,.28);border-radius:16px;padding:11px 0;position:relative;z-index:3;backdrop-filter:blur(8px)}
.tools .t{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:800;color:#C9B79C}
.tools .t .ic{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:18px}
.tools .t .ic.hl{background:linear-gradient(135deg,#E8A24B,#D65C37);color:#fff}
.foot{margin-top:auto;padding:12px 22px 14px;font-size:9px;color:#8C7B62;text-align:center;letter-spacing:.5px;position:relative;z-index:3}
.tag{position:absolute;top:14px;right:14px;background:rgba(232,162,75,.18);border:1px solid rgba(240,196,107,.5);color:#F7DDA0;font-size:10px;font-weight:800;padding:4px 9px;border-radius:999px;z-index:50}
</style></head><body><div class="phone"><div class="screen">
