<!doctype html><html lang="zh"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%}
body{background:#0b0e13;display:flex;align-items:center;justify-content:center;font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
.phone{width:390px;height:844px;background:#05070A;border-radius:46px;padding:11px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.screen{width:100%;height:100%;background:#0E1116;border-radius:36px;overflow:hidden;position:relative;display:flex;flex-direction:column;color:#E6EBF2}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:130px;height:28px;background:#05070A;border-radius:0 0 18px 18px;z-index:60}
.sb{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:700;color:#E6EBF2;z-index:5;margin-top:6px}
.sb .r{display:flex;gap:5px;align-items:center}.sb .d{width:6px;height:6px;border-radius:50%;background:#E6EBF2}
/* top teal ambient glow (chapter tint, default teal) */
.screen::before{content:"";position:absolute;top:-60px;left:-40px;width:300px;height:240px;background:radial-gradient(circle,rgba(31,182,166,.22),transparent 70%);pointer-events:none}
.hud{margin:6px 18px 0;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:3}
.hud .lv{display:flex;flex-direction:column}.hud .lv b{font-weight:900;font-size:17px}.hud .lv span{font-size:10px;color:#9AA6B5;font-weight:700;letter-spacing:.5px}
.hud .pause{width:38px;height:38px;border-radius:12px;background:#161B22;border:1px solid #2A323D;display:flex;align-items:center;justify-content:center;font-size:15px;color:#E6EBF2}
.ass{margin:10px 18px 0;background:#161B22;border:1px solid #2A323D;border-radius:14px;padding:10px 14px;position:relative;z-index:3}
.ass .top{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:#5FD9C9;margin-bottom:7px;letter-spacing:.3px}
.ass .bar{height:9px;background:#1B2128;border-radius:999px;overflow:hidden;display:flex;gap:2px}
.ass .bar i{flex:1;background:#1B2128;border-radius:2px}.ass .bar i.on{background:linear-gradient(90deg,#1FB6A6,#FF7A45)}
.sub{margin:9px 18px 0;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;position:relative;z-index:3}
.sub .timer{color:#E6EBF2;font-variant-numeric:tabular-nums}.sub .combo{color:#FF7A45}.sub .left{color:#9AA6B5}
.board{margin:10px 18px 0;flex:1;position:relative;background:#161B22;border:1px solid #2A323D;border-radius:18px;overflow:hidden;position:relative;
  background-image:radial-gradient(rgba(31,182,166,.18) 1.3px,transparent 1.5px);background-size:40px 40px;background-position:10px 10px}
.piece{position:absolute;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:700}
.piece.go{background:linear-gradient(160deg,rgba(31,182,166,.26),rgba(31,182,166,.10));border:1.5px solid #3FD0C0;color:#7FF0E2;box-shadow:0 0 14px rgba(31,182,166,.18)}
.piece.bad{background:linear-gradient(160deg,rgba(192,57,43,.24),rgba(192,57,43,.10));border:1.5px solid #E8766A;color:#FF9C8E}
.piece.neu{background:#1B2128;border:1.5px solid #2A323D;color:#8A95A5}
.tools{margin:10px 18px 0;display:flex;align-items:center;justify-content:space-around;background:#161B22;border:1px solid #2A323D;border-radius:16px;padding:11px 0;position:relative;z-index:3}
.tools .t{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:800;color:#9AA6B5}
.tools .t .ic{width:40px;height:40px;border-radius:12px;background:#1B2128;display:flex;align-items:center;justify-content:center;font-size:18px}
.tools .t .ic.hl{background:linear-gradient(135deg,#1FB6A6,#0E7C70);color:#fff}
.foot{margin-top:auto;padding:12px 22px 14px;font-size:9px;color:#5C6675;text-align:center;letter-spacing:.5px;position:relative;z-index:3}
.tag{position:absolute;top:14px;right:14px;background:rgba(31,182,166,.16);border:1px solid rgba(63,208,192,.4);color:#7FF0E2;font-size:10px;font-weight:800;padding:4px 9px;border-radius:999px;z-index:50}
</style></head><body><div class="phone"><div class="screen">
