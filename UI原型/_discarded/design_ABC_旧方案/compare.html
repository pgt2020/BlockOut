<!doctype html><html lang="zh"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(circle at 50% 0%,#1a2030,#0a0d14);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;padding:30px}
h1{color:#E6EBF2;font-size:20px;font-weight:900;margin-bottom:4px;letter-spacing:1px}
p{color:#8A95A5;font-size:12px;margin-bottom:22px}
.row{display:flex;gap:22px;align-items:flex-start}
.card{display:flex;flex-direction:column;align-items:center;width:248px}
.card .ph{width:248px;height:537px;border-radius:30px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.08)}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .nm{margin-top:12px;color:#E6EBF2;font-size:14px;font-weight:800}
.card .ds{margin-top:4px;color:#8A95A5;font-size:11px;text-align:center;line-height:1.5;max-width:230px}
.tag{display:inline-block;margin-top:8px;font-size:10px;font-weight:800;padding:3px 9px;border-radius:999px}
.tA{background:rgba(31,182,166,.16);color:#7FF0E2;border:1px solid rgba(63,208,192,.4)}
.tB{background:rgba(232,162,75,.16);color:#F7DDA0;border:1px solid rgba(240,196,107,.5)}
.tC{background:rgba(63,208,192,.16);color:#9BF5E8;border:1px solid rgba(63,208,192,.5)}
</style></head><body>
<h1>BLOCKOUT · 对局界面 3 个视觉方向</h1>
<p>同一关卡状态（6-8 / 剩余 21 块 / 连击×3 / 拼装 8·12）· 请选一个方向进入全量界面</p>
<div class="row">
  <div class="card"><div class="ph"><img src="png/A_科技简约.png"></div><div class="nm">A · 科技简约</div><div class="ds">严格落地既定 Token（青绿+橙·暗底·点阵），最稳、最规范</div><span class="tag tA">默认主题</span></div>
  <div class="card"><div class="ph"><img src="png/B_写实沉浸.png"></div><div class="nm">B · 写实沉浸·换皮</div><div class="ds">章节主色环境光晕+玻璃质感块，强展示「UI 按章换皮」（此图用金色主题）</div><span class="tag tB">按章换皮</span></div>
  <div class="card"><div class="ph"><img src="png/C_霓虹玻璃.png"></div><div class="nm">C · 霓虹玻璃</div><div class="ds">纯黑底+发光轨迹线，更游戏化、更有能量感与街机氛围</div><span class="tag tC">街机感</span></div>
</div>
</body></html>
