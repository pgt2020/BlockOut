<!doctype html><html lang="zh"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%}
body{background:#050608;display:flex;align-items:center;justify-content:center;font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
.phone{width:390px;height:844px;background:#000;border-radius:46px;padding:11px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.screen{width:100%;height:100%;background:#07090D;border-radius:36px;overflow:hidden;position:relative;display:flex;flex-direction:column;color:#EAF6FF}
.screen::before{content:"";position:absolute;top:-100px;left:50%;transform:translateX(-50%);width:420px;height:380px;background:radial-gradient(circle,rgba(31,182,166,.20),transparent 68%);pointer-events:none}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:130px;height:28px;background:#000;border-radius:0 0 18px 18px;z-index:60}
.sb{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:700;color:#EAF6FF;z-index:5;margin-top:6px;position:relative}
.sb .r{display:flex;gap:5px;align-items:center}.sb .d{width:6px;height:6px;border-radius:50%;background:#EAF6FF}
.hud{margin:6px 18px 0;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:3}
.hud .lv{display:flex;flex-direction:column}.hud .lv b{font-weight:900;font-size:17px;color:#7FF0E2;text-shadow:0 0 12px rgba(31,182,166,.6)}.hud .lv span{font-size:10px;color:#5FD9C9;font-weight:800;letter-spacing:1px}
.hud .pause{width:38px;height:38px;border-radius:12px;background:rgba(31,182,166,.10);border:1px solid rgba(63,208,192,.5);display:flex;align-items:center;justify-content:center;font-size:15px;color:#7FF0E2}
.ass{margin:10px 18px 0;background:rgba(255,255,255,.04);border:1px solid rgba(63,208,192,.35);border-radius:14px;padding:10px 14px;position:relative;z-index:3}
.ass .top{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:#5FD9C9;margin-bottom:7px;letter-spacing:.3px}
.ass .bar{height:9px;background:rgba(255,255,255,.06);border-radius:999px;overflow:hidden;display:flex;gap:2px}
.ass .bar i{flex:1;background:rgba(255,255,255,.06);border-radius:2px}.ass .bar i.on{background:linear-gradient(90deg,#1FB6A6,#3FD0C0);box-shadow:0 0 8px rgba(31,182,166,.6)}}
.sub{margin:9px 18px 0;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;position:relative;z-index:3}
.sub .timer{color:#EAF6FF;font-variant-numeric:tabular-nums}.sub .combo{color:#FF9E5C;text-shadow:0 0 8px rgba(255,122,69,.5)}.sub .left{color:#7E94A6}
.board{margin:10px 18px 0;flex:1;position:relative;background:#0A0E14;border:1px solid rgba(63,208,192,.25);border-radius:18px;overflow:hidden;
  background-image:linear-gradient(rgba(63,208,192,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(63,208,192,.06) 1px,transparent 1px);background-size:40px 40px;background-position:10px 10px;box-shadow:inset 0 0 40px rgba(31,182,166,.08)}
.piece{position:absolute;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:800}
/* trajectory dashed line to edge */
.piece.go::after{content:"";position:absolute;right:-26px;top:50%;transform:translateY(-50%);width:22px;height:0;border-top:2px dashed rgba(63,208,192,.7)}
.piece.go{background:linear-gradient(160deg,rgba(31,182,166,.30),rgba(31,182,166,.12));border:1.5px solid #3FD0C0;color:#9BF5E8;box-shadow:0 0 22px rgba(31,182,166,.55)}
.piece.bad{background:linear-gradient(160deg,rgba(224,118,106,.30),rgba(224,118,106,.12));border:1.5px solid #FF8A7A;color:#FFB3A8;box-shadow:0 0 18px rgba(224,118,106,.45)}
.piece.bad::after{content:"";position:absolute;right:-26px;top:50%;transform:translateY(-50%);width:22px;height:0;border-top:2px dashed rgba(255,138,122,.7)}
.piece.neu{background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.16);color:#9FB2C2;box-shadow:0 0 10px rgba(255,255,255,.04)}
.tools{margin:10px 18px 0;display:flex;align-items:center;justify-content:space-around;background:rgba(255,255,255,.04);border:1px solid rgba(63,208,192,.30);border-radius:16px;padding:11px 0;position:relative;z-index:3}
.tools .t{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:800;color:#7E94A6}
.tools .t .ic{width:40px;height:40px;border-radius:12px;background:rgba(31,182,166,.10);display:flex;align-items:center;justify-content:center;font-size:18px;border:1px solid rgba(63,208,192,.3)}
.tools .t .ic.hl{background:linear-gradient(135deg,#1FB6A6,#0E7C70);color:#fff;box-shadow:0 0 14px rgba(31,182,166,.5);border:none}
.foot{margin-top:auto;padding:12px 22px 14px;font-size:9px;color:#4A5A68;text-align:center;letter-spacing:.5px;position:relative;z-index:3}
.tag{position:absolute;top:14px;right:14px;background:rgba(31,182,166,.18);border:1px solid rgba(63,208,192,.5);color:#9BF5E8;font-size:10px;font-weight:800;padding:4px 9px;border-radius:999px;z-index:50}
</style></head><body><div class="phone"><div class="screen">
