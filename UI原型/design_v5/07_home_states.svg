<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1330" width="780" height="2660" role="img" aria-label="首页关键状态组图：新用户首次进入、章节已完成与新章节准备中、图片加载失败、小屏安全区适配">
  <!-- ============================================================
       BlockOut · 首页关键状态组图  v5 定稿（2026-10-15 复审修订）
       A 新用户首次进入：开始第 1 关 / 拼片 0/12 / 预览卡整图剪影 / 初始 300 金币
       B 章节已完成：12/12 完整作品 + CTA 进入下一章；第二章未发布 = 「新章节准备中」禁用态
       C 图片加载失败：占位 + 重试，不阻塞开始游戏
       D 小屏安全区：360×640 真实比例缩略（完整稿见 12_screen_adapt_360）
         底部导航位于底部安全区上方，不重叠；中部预览卡按剩余高度压缩
       每态给关键帧示意（缩略首页）+ 要点说明，不另画全屏高保真
  ============================================================ -->
  <defs>
    <linearGradient id="s7bg" x2="0" y2="1"><stop stop-color="#FFFAF4"/><stop offset="1" stop-color="#FFF1E3"/></linearGradient>
    <linearGradient id="g7top" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#B5EBD5"/><stop offset="1" stop-color="#79D2B2"/></linearGradient>
    <linearGradient id="g7cup" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FAE49B"/><stop offset="1" stop-color="#F2C957"/></linearGradient>
    <linearGradient id="g7cta" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FF8B7E"/><stop offset="1" stop-color="#FF6B5C"/></linearGradient>
    <filter id="s7sh" x="-30%" y="-30%" width="160%" height="175%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#674138" flood-opacity=".18"/></filter>
    <style>
      text{font-family:'Source Han Sans CN','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif}
      .h7{font-size:17px;font-weight:900;fill:#553B36}
      .sub7{font-size:9.5px;fill:#8A6E62}
      .sec7{font-size:12px;font-weight:900;fill:#FF7568}
      .pt7{font-size:8.5px;fill:#553B36}
      .lb7{font-size:7.5px;fill:#8A6E62}
    </style>
  </defs>

