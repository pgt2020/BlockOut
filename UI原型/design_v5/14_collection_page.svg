  <text class="ds14" x="195" y="1500" text-anchor="middle">同一 1080×1080 画布 + 12 区域遮罩；region 固定源画布，不随容器重划分</text>
  <text class="ds14" x="195" y="1516" text-anchor="middle">缩略用 cover；大图查看页用 contain 完整显示，不裁作品边缘</text>
  <text class="ds14" x="195" y="1532" text-anchor="middle">部分解锁：大图入口置灰/隐藏，放大也不得泄露未揭晓区域</text>
  <text class="ds14" x="195" y="1548" text-anchor="middle">手势：双指缩放 1.0–3.0 + 单指拖动；双击复位到 1.0（不是阶梯缩放）；重开复位</text>
  <text class="ds14" x="195" y="1564" text-anchor="middle">收藏采用滚动内容区：顶栏与底部导航固定，关卡热区固定 44×44 不重叠</text>
</svg>
