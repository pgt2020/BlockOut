<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="780" height="1688" role="img" aria-label="BlockOut 首页高保真设计图：继续第 12 关，章节作品进度 3/12">
  <!-- ============================================================
       BlockOut · 首页高保真设计图（与游戏页统一视觉系统）
       布局：顶部栏(设置+货币) / Logo / 章节作品主视觉卡 / 继续第 12 关主按钮
             / 章节进度 3/12 / 底部三导航（首页·图鉴·商店）
       修正 v4 问题：① 设置入口补齐（左上齿轮）② 导航图标改为规范矢量图标
                    ③ 章节进度准确 3/12（卡内 3 片揭晓 + 进度条与 12 圆点均为 3）
       图标全部矢量，无 emoji；对局外才展示作品目标
  ============================================================ -->
  <defs>
    <linearGradient id="hbg" x2="0" y2="1"><stop stop-color="#FFFAF4"/><stop offset="1" stop-color="#FFF1E3"/></linearGradient>
    <radialGradient id="bm"><stop stop-color="#62CFA7" stop-opacity=".16"/><stop offset="1" stop-color="#62CFA7" stop-opacity="0"/></radialGradient>
    <radialGradient id="bc"><stop stop-color="#FF7568" stop-opacity=".12"/><stop offset="1" stop-color="#FF7568" stop-opacity="0"/></radialGradient>
    <radialGradient id="by"><stop stop-color="#FFD166" stop-opacity=".14"/><stop offset="1" stop-color="#FFD166" stop-opacity="0"/></radialGradient>
    <filter id="hsh" x="-30%" y="-30%" width="160%" height="175%"><feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#674138" flood-opacity=".2"/></filter>
    <symbol id="ic-home" viewBox="0 0 24 24"><path d="M12 3.5L21 11.2h-2.6v9.1h-4.2v-5.7h-4.4v5.7H5.6v-9.1H3z"/></symbol>
    <symbol id="ic-set" viewBox="0 0 24 24">
      <g fill="none" stroke-linecap="round">
        <path d="M3.5 7h17M3.5 12h17M3.5 17h17"/>
        <circle cx="9" cy="7" r="2.6" fill="#fff"/>
        <circle cx="15.5" cy="12" r="2.6" fill="#fff"/>
        <circle cx="7.5" cy="17" r="2.6" fill="#fff"/>
      </g>
    </symbol>
    <symbol id="ic-star" viewBox="0 0 24 24"><path d="M12 2.2l2.9 6.2 6.8.8-5 4.6 1.3 6.7L12 17.2 6 20.5l1.3-6.7-5-4.6 6.8-.8z"/></symbol>
    <symbol id="ic-play" viewBox="0 0 24 24"><path d="M8 5.5l11 6.5-11 6.5z"/></symbol>
    <symbol id="ic-spark" viewBox="-12 -12 24 24"><path d="M0-11Q1.2-1.2 11 0 1.2 1.2 0 11-1.2 1.2-11 0-1.2-1.2 0-11z"/></symbol>
    <symbol id="ic-album" viewBox="0 0 24 24">
      <rect x="3" y="4.5" width="18" height="15" rx="3"/>
      <circle cx="8.6" cy="9.6" r="1.7" fill="#fff" opacity=".9"/>
      <path d="M4.5 17.5l4.2-4.2 3 3 3.6-3.6 4.2 4.2" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="ic-shop" viewBox="0 0 24 24">
      <path d="M3.5 5h2.2l2.3 10.5h9.6l2-7.5H7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="10" cy="19" r="1.7"/>
      <circle cx="16.5" cy="19" r="1.7"/>
    </symbol>
    <style>
      text{font-family:'Microsoft YaHei','PingFang SC',Arial,sans-serif}
      .logo{font-size:40px;font-weight:900;letter-spacing:1px}
      .sub{font-size:11px;fill:#8A6E62}
      .coin{font-size:15px;font-weight:900;fill:#553B36}
      .pillD{font-size:11px;font-weight:900;fill:#E85A4C}
      .pillN{font-size:12px;font-weight:900;fill:#FFFFFF}
      .artName{font-size:12.5px;font-weight:900;fill:#553B36}
      .artSub{font-size:10.5px;fill:#8A6E62}
      .cta{font-size:22px;font-weight:900;fill:#FFFFFF}
      .ctaSub{font-size:10.5px;fill:#FFFFFF;opacity:.92}
      .prgT{font-size:13px;font-weight:900;fill:#553B36}
      .prgN{font-size:16px;font-weight:900;fill:#FF7568}
      .prgSub{font-size:10.5px;fill:#8A6E62}
      .navA{font-size:10.5px;font-weight:900;fill:#E85A4C}
      .navN{font-size:10.5px;fill:#A98C7B}
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="390" height="844" fill="url(#hbg)"/>
  <circle cx="60" cy="140" r="150" fill="url(#bm)"/>
  <circle cx="340" cy="300" r="160" fill="url(#bc)"/>
  <circle cx="70" cy="700" r="140" fill="url(#by)"/>
  <g fill="#F0D3BC" opacity=".75">
    <circle cx="48" cy="210" r="2.5"/><circle cx="344" cy="180" r="2.5"/><circle cx="58" cy="500" r="2.5"/>
    <circle cx="350" cy="640" r="2.5"/><circle cx="90" cy="800" r="2"/><circle cx="300" cy="90" r="2"/>
  </g>

  <!-- ================= 顶部栏：设置入口 + 货币 ================= -->
  <circle cx="46" cy="42" r="22" fill="#FFFFFF" filter="url(#hsh)"/>
  <use href="#ic-set" x="37" y="33" width="18" height="18" stroke="#553B36" stroke-width="2.2"/>
  <rect x="294" y="22" width="72" height="40" rx="20" fill="#FFFFFF" filter="url(#hsh)"/>
  <use href="#ic-star" x="308" y="33" width="18" height="18" fill="#FFC53D"/>
  <text class="coin" x="336" y="47">170</text>

  <!-- ================= Logo ================= -->
  <use href="#ic-spark" x="98" y="86" width="12" height="12" fill="#FFD166"/>
  <use href="#ic-spark" x="279" y="80" width="9" height="9" fill="#FFB3C7"/>
  <use href="#ic-spark" x="262" y="116" width="7" height="7" fill="#62CFA7"/>
  <text class="logo" x="195" y="118" text-anchor="middle"><tspan fill="#553B36">Block</tspan><tspan fill="#FF7568">Out</tspan></text>
  <text class="sub" x="195" y="142" text-anchor="middle">箭头方块消除 · Tap Away</text>

  <!-- ================= 章节作品主视觉卡（3/12 已揭晓） ================= -->
  <rect x="24" y="156" width="342" height="300" rx="28" fill="#FFFDF8" stroke="#F3DCC9" stroke-width="2.5" filter="url(#hsh)"/>
  <rect x="44" y="174" width="76" height="26" rx="13" fill="#FFE9E2" stroke="#FFC1B4" stroke-width="1.5"/>
  <text class="pillD" x="82" y="191" text-anchor="middle">章节作品</text>
  <rect x="294" y="174" width="52" height="26" rx="13" fill="#62CFA7"/>
  <text class="pillN" x="320" y="191" text-anchor="middle">3/12</text>

  <!-- 纸杯蛋糕剪影（灰色=未揭晓） -->
  <g fill="#EDDFD2" stroke="#DAC4B1" stroke-width="2">
    <circle cx="160" cy="300" r="32"/>
    <circle cx="230" cy="300" r="32"/>
    <circle cx="195" cy="268" r="36"/>
    <circle cx="195" cy="238" r="28"/>
    <circle cx="195" cy="212" r="10"/>
    <path d="M156 320L234 320L223 398Q221 408 211 408L179 408Q169 408 167 398Z"/>
    <rect x="152" y="314" width="86" height="12" rx="6"/>
  </g>
  <!-- 灰色区域的糖粒 -->
  <g fill="#DAC4B1">
    <rect x="218" y="290.5" width="9" height="3" rx="1.5" transform="rotate(15 222 292)"/>
    <rect x="236" y="310.5" width="9" height="3" rx="1.5" transform="rotate(-20 240 312)"/>
    <rect x="184" y="284.5" width="9" height="3" rx="1.5" transform="rotate(10 188 286)"/>
  </g>
  <!-- 已揭晓的 3 片（糖果色 + 白色拼片边） -->
  <g stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round">
    <circle cx="195" cy="238" r="28" fill="#62CFA7"/>
    <circle cx="195" cy="212" r="10" fill="#F45F70"/>
    <circle cx="160" cy="300" r="32" fill="#FF7568"/>
    <path d="M167 352L223 352L216 398Q214 408 205 408L185 408Q176 408 174 398Z" fill="#FFD166"/>
  </g>

  <text class="artName" x="195" y="428" text-anchor="middle">甜点星球 Dessert Planet</text>
  <text class="artSub" x="195" y="445" text-anchor="middle">每通关 1 关揭晓 1 片 · 还差 9 片</text>

  <!-- ================= 主按钮：继续第 12 关 ================= -->
  <rect x="48" y="479" width="294" height="96" rx="28" fill="#E05A48"/>
  <rect x="48" y="472" width="294" height="96" rx="28" fill="#FF7568"/>
  <ellipse cx="195" cy="482" rx="138" ry="24" fill="#FFFFFF" opacity=".13"/>
  <use href="#ic-play" x="92" y="507" width="26" height="26" fill="#FFFFFF"/>
  <text class="cta" x="212" y="519" text-anchor="middle">继续第 12 关</text>
  <text class="ctaSub" x="195" y="545" text-anchor="middle">通关收集拼片 · 还差 9 片揭晓完整作品</text>

  <!-- ================= 章节进度 3/12 ================= -->
  <rect x="24" y="592" width="342" height="116" rx="22" fill="#FFFDF8" stroke="#F3DCC9" stroke-width="2"/>
  <text class="prgT" x="44" y="620">章节进度</text>
  <text class="prgN" x="346" y="620" text-anchor="end">3/12</text>
  <rect x="44" y="634" width="302" height="12" rx="6" fill="#F6E7DA"/>
  <rect x="44" y="634" width="75.5" height="12" rx="6" fill="#FF7568"/>
  <g>
    <circle cx="52" cy="662" r="5" fill="#FF7568"/><circle cx="78" cy="662" r="5" fill="#FF7568"/><circle cx="104" cy="662" r="5" fill="#FF7568"/>
    <circle cx="130" cy="662" r="5" fill="#EBD9C9"/><circle cx="156" cy="662" r="5" fill="#EBD9C9"/><circle cx="182" cy="662" r="5" fill="#EBD9C9"/>
    <circle cx="208" cy="662" r="5" fill="#EBD9C9"/><circle cx="234" cy="662" r="5" fill="#EBD9C9"/><circle cx="260" cy="662" r="5" fill="#EBD9C9"/>
    <circle cx="286" cy="662" r="5" fill="#EBD9C9"/><circle cx="312" cy="662" r="5" fill="#EBD9C9"/><circle cx="338" cy="662" r="5" fill="#EBD9C9"/>
  </g>
  <text class="prgSub" x="44" y="700">每通关 1 关收集 1 片拼片</text>

  <!-- ================= 底部三导航 ================= -->
  <rect x="24" y="740" width="342" height="64" rx="22" fill="#FFFDF8" stroke="#F3DCC9" stroke-width="2" filter="url(#hsh)"/>
  <use href="#ic-home" x="85" y="752" width="24" height="24" fill="#FF7568"/>
  <text class="navA" x="97" y="794" text-anchor="middle">首页</text>
  <rect x="87" y="802" width="20" height="4" rx="2" fill="#FF7568"/>
  <use href="#ic-album" x="183" y="752" width="24" height="24" fill="#B49A88"/>
  <text class="navN" x="195" y="794" text-anchor="middle">图鉴</text>
  <use href="#ic-shop" x="281" y="752" width="24" height="24" fill="#B49A88" stroke="#B49A88" stroke-width="2.1"/>
  <text class="navN" x="293" y="794" text-anchor="middle">商店</text>

  <!-- 手机底部指示条 -->
  <rect x="128" y="826" width="134" height="5" rx="2.5" fill="#553B36" opacity=".2"/>
</svg>
