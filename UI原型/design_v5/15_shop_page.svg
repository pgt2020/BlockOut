<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1552" width="780" height="3104" role="img" aria-label="商店完整页面：三商品、已解锁可买、未解锁禁买、金币不足、购买中、购买成功、购买失败状态与返回路径">
  <!-- ============================================================
       BlockOut · 商店页  v5 定稿（2026-10-15 复审修订）
       商品：提示 / 锤子 / 魔法棒，单价 300 金币
       首发建议：未解锁商品显示等级条件并禁买（不售卖未解锁道具）
       购买：本地金币事务（首发无服务端依赖）；成功扣币 + 库存 +1 并写入本地存档；
             失败不扣币、不发道具；单飞锁防重复点击
       返回：首页底部导航进入 → 返回首页；暂停层进入 → 返回暂停层（保持暂停）
  ============================================================ -->
  <defs>
    <linearGradient id="s15bg" x2="0" y2="1"><stop stop-color="#FFFAF4"/><stop offset="1" stop-color="#FFF1E3"/></linearGradient>
    <linearGradient id="g15cta" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FF8B7E"/><stop offset="1" stop-color="#FF6B5C"/></linearGradient>
    <radialGradient id="bm15"><stop stop-color="#FFC53D" stop-opacity=".12"/><stop offset="1" stop-color="#FFC53D" stop-opacity="0"/></radialGradient>
    <symbol id="coin15" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10" fill="#FFC53D" stroke="#E3A22E" stroke-width="1.4"/>
      <circle cx="12" cy="12" r="6.5" fill="none" stroke="#FFE9B0" stroke-width="1.4"/>
      <path d="M12 7l1.6 3.4 3.4 1.6-3.4 1.6L12 17l-1.6-3.4L7 12l3.4-1.6z" fill="#E3A22E"/>
    </symbol>
    <symbol id="lock15" viewBox="0 0 24 24">
      <rect x="5" y="10.5" width="14" height="10" rx="2.5"/>
      <path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" fill="none"/>
    </symbol>
    <symbol id="back15" viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="home15" viewBox="0 0 24 24"><path d="M12 3.2l9 7.6h-2.6v9.4H5.6v-9.4H3z"/></symbol>
    <symbol id="book15" viewBox="0 0 24 24"><path d="M4 4.6h6.2A2.8 2.8 0 0 1 12 6.8v13a2.4 2.4 0 0 0-1.8-1.4H4zm16 0h-6.2A2.8 2.8 0 0 0 12 6.8v13a2.4 2.4 0 0 1 1.8-1.4H20z"/></symbol>
    <symbol id="bag15" viewBox="0 0 24 24"><path d="M8.5 8V6.5a3.5 3.5 0 0 1 7 0V8h1.8l1.2 12H5.5L6.7 8z"/></symbol>
    <symbol id="bulb15" viewBox="0 0 24 24">
      <path d="M12 3a6 6 0 0 1 3.4 10.9c-.7.5-1 1.2-1 2.1h-4.8c0-.9-.3-1.6-1-2.1A6 6 0 0 1 12 3z"/>
      <path d="M9.8 18.5h4.4" fill="none"/>
    </symbol>
    <symbol id="hammer15" viewBox="0 0 24 24">
      <path d="M14.5 3.5l6 6-2.5 2.5-6-6z"/>
      <path d="M13 7l-8.5 8.5c-1 1-1 2.6 0 3.5s2.6 1 3.5 0L16.5 11" fill="none"/>
    </symbol>
    <symbol id="wand15" viewBox="0 0 24 24">
      <path d="M5 19L15.5 8.5" fill="none"/>
      <path d="M16.5 3.5l1.2 2.8 2.8 1.2-2.8 1.2-1.2 2.8-1.2-2.8-2.8-1.2 2.8-1.2z"/>
      <path d="M19.5 14l.8 1.7 1.7.8-1.7.8-.8 1.7-.8-1.7-1.7-.8 1.7-.8z"/>
    </symbol>
    <style>
      text{font-family:'Source Han Sans CN','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif}
      .cap15{font-size:11px;font-weight:900;fill:#553B36}
      .ds15{font-size:8.5px;fill:#8A6E62}
      .nt15{font-size:8.5px;fill:#553B36}
    </style>
  </defs>

  <rect width="390" height="1500" fill="url(#s15bg)"/>
  <text x="195" y="28" text-anchor="middle" font-size="15" font-weight="900" fill="#553B36">商店页 · 完整页面（390×844）</text>
  <text x="195" y="46" text-anchor="middle" font-size="8.5" fill="#8A6E62">示例：第 7 关后（提示可买；锤子/魔法棒未解锁禁买）；下方为购买流程四态</text>

  <!-- ================= 完整页面 ================= -->
  <g transform="translate(0,60)">
    <circle cx="340" cy="110" r="150" fill="url(#bm15)"/>
    <!-- 顶部栏：返回 + 标题 + 余额 -->
    <circle cx="46" cy="50" r="22" fill="#FFFFFF" stroke="#F0DCCB" stroke-width="1.5"/>
    <use href="#back15" x="37" y="41" width="18" height="18" stroke="#553B36" fill="none"/>
    <text x="195" y="56" text-anchor="middle" font-size="16" font-weight="900" fill="#553B36">商店</text>
    <rect x="244" y="33" width="92" height="24" rx="12" fill="#FFF1E3" stroke="#F0DCCB" stroke-width="1"/>
    <use href="#coin15" x="252" y="36" width="18" height="18"/>
    <text x="275" y="49" font-size="10" font-weight="900" fill="#553B36">600</text>

    <!-- 商品卡 1：提示（已解锁可买） -->
    <rect x="24" y="84" width="342" height="112" rx="20" fill="#FFFDF8" stroke="#F0DCCB" stroke-width="2"/>
    <circle cx="64" cy="132" r="26" fill="#FFF7EF" stroke="#F0DCCB" stroke-width="1.5"/>
    <use href="#bulb15" x="52" y="120" width="24" height="24" fill="#553B36" stroke="#553B36" stroke-width="1.6"/>
    <text x="102" y="118" font-size="13" font-weight="900" fill="#553B36">提示</text>
    <text x="102" y="136" font-size="8.5" fill="#8A6E62">高亮可飞块 2.5 秒 · 库存 3</text>
    <use href="#coin15" x="102" y="148" width="14" height="14"/>
    <text x="120" y="159" font-size="10" font-weight="700" fill="#7A4A00">300 金币</text>
    <rect x="278" y="112" width="72" height="36" rx="18" fill="url(#g15cta)"/>
    <text x="314" y="135" text-anchor="middle" font-size="11" font-weight="900" fill="#FFFFFF">购买</text>

    <!-- 商品卡 2：锤子（未解锁禁买） -->
    <rect x="24" y="208" width="342" height="112" rx="20" fill="#F3ECE4" stroke="#E5D5C6" stroke-width="2"/>
    <circle cx="64" cy="256" r="26" fill="#FFFDF8" stroke="#E5D5C6" stroke-width="1.5"/>
    <use href="#hammer15" x="52" y="244" width="24" height="24" fill="#C9B8AC" stroke="#C9B8AC" stroke-width="1.6"/>
    <circle cx="84" cy="238" r="10" fill="#8A6E62"/>
    <use href="#lock15" x="79.5" y="233.5" width="9" height="9" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2.4"/>
    <text x="102" y="242" font-size="13" font-weight="900" fill="#8A7568">锤子</text>
    <text x="102" y="260" font-size="8.5" fill="#8A6E62">消除任意在场块 · 第 11 关解锁</text>
    <text x="102" y="278" font-size="8.5" fill="#8A6E62">解锁前暂不可购买</text>
    <rect x="278" y="236" width="72" height="36" rx="18" fill="#E5D5C6"/>
    <text x="314" y="259" text-anchor="middle" font-size="11" font-weight="900" fill="#FFFDF8">禁买</text>

    <!-- 商品卡 3：魔法棒（未解锁禁买） -->
    <rect x="24" y="332" width="342" height="112" rx="20" fill="#F3ECE4" stroke="#E5D5C6" stroke-width="2"/>
    <circle cx="64" cy="380" r="26" fill="#FFFDF8" stroke="#E5D5C6" stroke-width="1.5"/>
    <use href="#wand15" x="52" y="368" width="24" height="24" fill="#E5D5C6" stroke="#C9B8AC" stroke-width="1.8"/>
    <circle cx="84" cy="362" r="10" fill="#8A6E62"/>
    <use href="#lock15" x="79.5" y="357.5" width="9" height="9" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2.4"/>
    <text x="102" y="366" font-size="13" font-weight="900" fill="#8A7568">魔法棒</text>
    <text x="102" y="384" font-size="8.5" fill="#8A6E62">自动飞出最多 3 个可飞块 · 第 16 关解锁</text>
    <text x="102" y="402" font-size="8.5" fill="#8A6E62">解锁前暂不可购买</text>
    <rect x="278" y="360" width="72" height="36" rx="18" fill="#E5D5C6"/>
    <text x="314" y="383" text-anchor="middle" font-size="11" font-weight="900" fill="#FFFDF8">禁买</text>

    <!-- 金币获取说明（玩家可见，简明） -->
    <rect x="24" y="554" width="342" height="86" rx="16" fill="#FFF7EF" stroke="#F0DCCB" stroke-width="1.5"/>
    <use href="#coin15" x="40" y="570" width="20" height="20"/>
    <text x="68" y="585" font-size="10" font-weight="900" fill="#553B36">金币获取</text>
    <text x="40" y="610" font-size="8" fill="#8A6E62">通关和重复挑战可获得金币</text>

    <!-- 底部导航（商店激活） -->
    <rect x="24" y="700" width="342" height="64" rx="22" fill="#FFFFFF" stroke="#F0DCCB" stroke-width="2"/>
    <use href="#home15" x="85" y="716" width="20" height="20" fill="#B9A79B"/>
    <text x="95" y="752" text-anchor="middle" font-size="9" font-weight="800" fill="#8A7568">首页</text>
    <use href="#book15" x="195" y="716" width="20" height="20" fill="#B9A79B"/>
    <text x="205" y="752" text-anchor="middle" font-size="9" font-weight="800" fill="#8A7568">图鉴</text>
    <use href="#bag15" x="305" y="716" width="20" height="20" fill="#FF6B5C"/>
    <text x="315" y="752" text-anchor="middle" font-size="9" font-weight="800" fill="#FF6B5C">商店</text>
    <path d="M24 776H366" stroke="#F45F70" stroke-width="1" stroke-dasharray="4 3"/>
    <rect x="24" y="776" width="342" height="36" fill="#674138" opacity=".07"/>
    <text x="195" y="798" text-anchor="middle" font-size="7" font-weight="700" fill="#8A6E62">底部安全区（读设备 insets）· 导航止于安全区上方</text>
    <rect x="128" y="824" width="134" height="5" rx="2.5" fill="#553B36" opacity=".2"/>
  </g>
  <text class="cap15" x="195" y="938" text-anchor="middle">图 1 · 商店完整页面（入口：底部导航商店；返回：首页或暂停层）</text>

  <!-- ================= 购买流程四态 ================= -->
  <text x="24" y="972" font-size="11" font-weight="900" fill="#FF7568">购买流程四态（以「提示」为例）</text>

  <!-- 购买中 -->
  <g transform="translate(24,984)">
    <rect width="165" height="216" rx="16" fill="#FFFDF8" stroke="#F0DCCB" stroke-width="1.5"/>
    <text x="82.5" y="20" text-anchor="middle" font-size="10" font-weight="900" fill="#553B36">购买中</text>
    <rect x="16" y="34" width="133" height="72" rx="12" fill="#FFFFFF" stroke="#F0DCCB" stroke-width="1.2"/>
    <circle cx="42" cy="70" r="18" fill="#FFF7EF" stroke="#F0DCCB" stroke-width="1"/>
    <use href="#bulb15" x="31" y="59" width="22" height="22" fill="#553B36"/>
    <text x="70" y="66" font-size="10" font-weight="800" fill="#553B36">提示 ×1</text>
    <use href="#coin15" x="70" y="74" width="11" height="11"/>
    <text x="84" y="84" font-size="8.5" font-weight="700" fill="#7A4A00">300 金币</text>
    <rect x="104" y="54" width="38" height="24" rx="12" fill="#FFB84D"/>
    <text x="123" y="70" text-anchor="middle" font-size="8" font-weight="900" fill="#FFFFFF">…</text>
    <text x="82.5" y="128" text-anchor="middle" font-size="8" fill="#8A6E62">请稍候</text>
    <text x="82.5" y="144" text-anchor="middle" font-size="7.5" fill="#8A6E62">切勿重复点击</text>
  </g>

  <!-- 购买成功 -->
  <g transform="translate(201,984)">
    <rect width="165" height="216" rx="16" fill="#FFFDF8" stroke="#F0DCCB" stroke-width="1.5"/>
    <text x="82.5" y="20" text-anchor="middle" font-size="10" font-weight="900" fill="#553B36">购买成功</text>
    <rect x="16" y="34" width="133" height="72" rx="12" fill="#DFF6EC" stroke="#62CFA7" stroke-width="1.5"/>
    <circle cx="42" cy="70" r="18" fill="#FFFFFF" stroke="#62CFA7" stroke-width="1"/>
    <use href="#bulb15" x="31" y="59" width="22" height="22" fill="#2E7C5B"/>
    <text x="70" y="66" font-size="10" font-weight="800" fill="#2E7C5B">提示 +1</text>
    <text x="70" y="84" font-size="8.5" fill="#2E7C5B">余额 −300</text>
    <rect x="30" y="118" width="105" height="22" rx="11" fill="#2E7C5B"/>
    <text x="82.5" y="133" text-anchor="middle" font-size="8" font-weight="900" fill="#FFFFFF">Toast · 购买成功</text>
    <text x="82.5" y="162" text-anchor="middle" font-size="7.5" fill="#8A6E62">库存徽标 +1（300ms 回弹）</text>
    <text x="82.5" y="178" text-anchor="middle" font-size="7.5" fill="#8A6E62">余额胶囊即时刷新</text>
    <text x="82.5" y="200" text-anchor="middle" font-size="7" fill="#8A6E62">Toast 200/200ms · 停留 2s</text>
  </g>

  <!-- 购买失败 -->
  <g transform="translate(24,1212)">
    <rect width="165" height="216" rx="16" fill="#FFFDF8" stroke="#F0DCCB" stroke-width="1.5"/>
    <text x="82.5" y="20" text-anchor="middle" font-size="10" font-weight="900" fill="#553B36">购买失败</text>
    <rect x="16" y="34" width="133" height="72" rx="12" fill="#FFE9E6" stroke="#F45F70" stroke-width="1.5"/>
    <path d="M52 62l16 16M68 62l-16 16" stroke="#F45F70" stroke-width="2.6" stroke-linecap="round"/>
    <text x="92" y="66" font-size="10" font-weight="800" fill="#C7432F">购买失败</text>
    <text x="92" y="84" font-size="8.5" fill="#C7432F">未扣币 · 未发道具</text>
    <rect x="30" y="118" width="105" height="22" rx="11" fill="#553B36" opacity=".85"/>
    <text x="82.5" y="133" text-anchor="middle" font-size="8" font-weight="900" fill="#FFFFFF">Toast · 失败原因</text>
    <text x="82.5" y="162" text-anchor="middle" font-size="7.5" fill="#8A6E62">按钮回退可重试</text>
    <text x="82.5" y="178" text-anchor="middle" font-size="7.5" fill="#8A6E62">余额/库存不变</text>
    <text x="82.5" y="200" text-anchor="middle" font-size="7" fill="#8A6E62">本地交易失败可重试</text>
  </g>

  <!-- 金币不足 -->
  <g transform="translate(201,1212)">
    <rect width="165" height="216" rx="16" fill="#FFFDF8" stroke="#F0DCCB" stroke-width="1.5"/>
    <text x="82.5" y="20" text-anchor="middle" font-size="10" font-weight="900" fill="#553B36">金币不足</text>
    <rect x="16" y="34" width="133" height="72" rx="12" fill="#FFFFFF" stroke="#F0DCCB" stroke-width="1.2"/>
    <circle cx="42" cy="70" r="18" fill="#F3ECE4" stroke="#E5D5C6" stroke-width="1"/>
    <use href="#bulb15" x="31" y="59" width="22" height="22" fill="#C9B8AC"/>
    <text x="70" y="66" font-size="10" font-weight="800" fill="#8A7568">提示 ×1</text>
    <use href="#coin15" x="70" y="74" width="11" height="11"/>
    <text x="84" y="84" font-size="8.5" font-weight="700" fill="#F45F70">300 金币</text>
    <rect x="104" y="54" width="38" height="24" rx="12" fill="#E5D5C6"/>
    <text x="123" y="70" text-anchor="middle" font-size="8" font-weight="900" fill="#FFFDF8">购买</text>
    <rect x="24" y="118" width="117" height="22" rx="11" fill="#553B36" opacity=".85"/>
    <text x="82.5" y="133" text-anchor="middle" font-size="8" font-weight="900" fill="#FFFFFF">金币不足 · 通关可获取</text>
    <text x="82.5" y="162" text-anchor="middle" font-size="7.5" fill="#8A6E62">按钮置灰，不扣币</text>
    <text x="82.5" y="178" text-anchor="middle" font-size="7.5" fill="#8A6E62">不跳转、不弹阻断窗</text>
    <text x="82.5" y="200" text-anchor="middle" font-size="7" fill="#8A6E62">失败层同样仅提示（见 05-E）</text>
  </g>

  <text class="nt15" x="195" y="1466" text-anchor="middle">状态机：可购买 → 购买中（请稍候） → 本地事务成功 / 失败</text>
  <text class="ds15" x="195" y="1482" text-anchor="middle">未解锁与金币不足为入口禁态；300 金币为冻结值（09 §0）</text>
  <text class="ds15" x="195" y="1498" text-anchor="middle">【设计注释】单价 300 金币（冻结值，09 §0）；首发购买 = 本地原子事务，无服务端依赖；</text>
  <text class="ds15" x="195" y="1512" text-anchor="middle">按钮单飞锁防重复扣币；成功扣币 + 库存 +1 写入本地存档，失败不扣币、不发道具。</text>
  <text class="ds15" x="195" y="1528" text-anchor="middle">【设计注释】从暂停层进入商店：返回暂停层、对局保持暂停；首发不提供金币内购，</text>
  <text class="ds15" x="195" y="1542" text-anchor="middle">失败层无「去商店」引导（商店只卖道具）。</text>
</svg>
