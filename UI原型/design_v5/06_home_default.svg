<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 390 844" width="780" height="1688" role="img" aria-label="BlockOut 首页最终版：遮罩作品预览卡显示真实章节作品 3/12 进度，金币统一图标，继续第4关唯一CTA，拼片进度3/12，底部三导航">
  <!-- ============================================================
       BlockOut · 首页最终版（默认状态）  v5 定稿
       修订记录（相对 03_home_hifi 初稿）：
       ① 预览卡显示真实章节作品（assets/r03_330x288.png，3/12 进度）；玩法演示叠层见 05/07 状态稿
       ② 货币统一为金币图标（新 ic-coin），替换星星（问题 6）
       ③ 关卡编号自洽：继续第 4 关 = 已通关 3 关 = 拼片 3/12（第一章共 12 关，问题 5）
       ④ 遮罩预览：未揭晓部件用剪影色+薄雾，不展示未解锁完整图；冰淇淋为示意剪影，
          正式章节图集素材另列资源需求（问题 4 / 交付边界）
       ⑤ 布局遵循 Brief：顶部小字标+金币+设置 / 中央遮罩预览卡 / 唯一最强 CTA /
          12 拼片节点+查看收藏 / 底部三导航 / 安全区
  ============================================================ -->
  <defs>
    <linearGradient id="hbg" x2="0" y2="1"><stop stop-color="#FFFAF4"/><stop offset="1" stop-color="#FFF1E3"/></linearGradient>
    <radialGradient id="hm"><stop stop-color="#62CFA7" stop-opacity=".16"/><stop offset="1" stop-color="#62CFA7" stop-opacity="0"/></radialGradient>
    <radialGradient id="hc"><stop stop-color="#FF7568" stop-opacity=".12"/><stop offset="1" stop-color="#FF7568" stop-opacity="0"/></radialGradient>
    <linearGradient id="gcta" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FF8B7E"/><stop offset="1" stop-color="#FF6B5C"/></linearGradient>
    <linearGradient id="gtop" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#B5EBD5"/><stop offset="1" stop-color="#79D2B2"/></linearGradient>
    <linearGradient id="gcup" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FAE49B"/><stop offset="1" stop-color="#F2C957"/></linearGradient>
    <linearGradient id="gta" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#F8CCA0"/><stop offset="1" stop-color="#F0AC6E"/></linearGradient>
    <linearGradient id="gtb" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#A9E8CF"/><stop offset="1" stop-color="#79D2B2"/></linearGradient>
    <filter id="jsh" x="-30%" y="-30%" width="160%" height="175%"><feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#674138" flood-opacity=".22"/></filter>
    <filter id="jsh2" x="-30%" y="-30%" width="160%" height="175%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#674138" flood-opacity=".18"/></filter>

    <!-- 统一金币图标（问题 6）：金圆 + 深金边 + 亮金内环 + 星形压印 -->
    <symbol id="ic-coin" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" fill="#FFC53D" stroke="#E3A22E" stroke-width="1.5"/>
      <circle cx="12" cy="12" r="5.6" fill="none" stroke="#FFE9B0" stroke-width="1.4"/>
      <path d="M12 7.8l1.3 2.7 2.9.3-2.2 2 .6 2.9-2.6-1.5-2.6 1.5.6-2.9-2.2-2 2.9-.3z" fill="#E3A22E"/>
    </symbol>
    <!-- 设置齿轮（Material 风格 24 齿） -->
    <symbol id="ic-gear" viewBox="0 0 24 24">
      <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.63-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.14 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.31-.09.63-.09.94s.02.63.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/>
    </symbol>
    <!-- 底部导航 -->
    <symbol id="ic-home" viewBox="0 0 24 24">
      <path d="M12 3.2l9 8.1v9.5a1 1 0 0 1-1 1h-5.5v-6.5h-5V21.8H4a1 1 0 0 1-1-1v-9.5z"/>
    </symbol>
    <symbol id="ic-book" viewBox="0 0 24 24">
      <path d="M12 6.6C10.1 4.9 7.4 4.5 4 5.2v13.2c3.4-.7 6.1-.3 8 1.4 1.9-1.7 4.6-2.1 8-1.4V5.2c-3.4-.7-6.1-.3-8 1.4z"/>
      <path d="M12 6.6v13.2" fill="none" stroke="#FFFDF8" stroke-width="1.4"/>
    </symbol>
    <symbol id="ic-bag" viewBox="0 0 24 24">
      <path d="M6 8h12l1.1 12.1a1 1 0 0 1-1 1.1H5.9a1 1 0 0 1-1-1.1z"/>
      <path d="M9 10.5V7a3 3 0 0 1 6 0v3.5" fill="none" stroke-width="2"/>
    </symbol>
    <!-- 箭头（logo/CTA/玩具块共用） -->
    <symbol id="arw-r" viewBox="0 0 24 24"><path d="M20.5 12L9.5 20.5v-5.5h-6v-6h6V3.5z"/></symbol>
    <symbol id="arw-u" viewBox="0 0 24 24"><path d="M12 3.5l8.5 11h-5.5v6h-6v-6H3.5z"/></symbol>
    <style>
      text{font-family:'Source Han Sans CN','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif}
      .lg1{font-size:15px;font-weight:900;fill:#553B36}
      .lg2{font-size:7.5px;fill:#8A6E62}
      .cn{font-size:12px;font-weight:900;fill:#553B36}
      .ct1{font-size:17px;font-weight:900;fill:#FFFFFF}
      .ct2{font-size:9px;fill:#FFFFFF;opacity:.88}
      .cd1{font-size:11px;font-weight:800;fill:#553B36}
      .cd2{font-size:9px;fill:#8A6E62}
      .nv{font-size:9px;font-weight:800}
      .seam{stroke:#FFFFFF;stroke-width:2;opacity:.55;fill:none}
      .rim{fill:none;stroke:#FFFFFF;stroke-width:3;stroke-linejoin:round;opacity:.92}
    </style>
  </defs>

  <rect width="390" height="844" fill="url(#hbg)"/>
  <circle cx="55" cy="130" r="150" fill="url(#hm)"/>
  <circle cx="345" cy="430" r="165" fill="url(#hc)"/>
  <circle cx="70" cy="780" r="150" fill="url(#hm)"/>

  <!-- ================= 顶部：小字标 | 金币 | 设置 ================= -->
  <g filter="url(#jsh2)">
    <rect x="24" y="42" width="36" height="36" rx="11" fill="url(#gtop)"/>
  </g>
  <use href="#arw-r" x="31" y="49" width="22" height="22" fill="#FFFEFA" stroke="#3BB98E" stroke-width="1.2"/>
  <text class="lg1" x="70" y="57">BlockOut</text>
  <text class="lg2" x="70" y="71">箭头方块消除</text>

  <!-- 金币（统一金币图标，替换初稿星星） -->
  <g filter="url(#jsh2)">
    <rect x="224" y="45" width="94" height="30" rx="15" fill="#FFFDF8" stroke="#F0DCCB" stroke-width="1.5"/>
  </g>
  <use href="#ic-coin" x="233" y="51" width="18" height="18"/>
  <text class="cn" x="257" y="65">300</text>

  <!-- 设置 -->
  <circle cx="344" cy="60" r="18" fill="#FFFDF8" stroke="#F0DCCB" stroke-width="1.5" filter="url(#jsh2)"/>
  <use href="#ic-gear" x="334" y="50" width="20" height="20" fill="#553B36"/>

  <!-- ================= 中央：遮罩作品预览卡 ================= -->
  <g filter="url(#jsh)">
    <rect x="24" y="148" width="342" height="300" rx="24" fill="#FFFDF8" stroke="#F0DCCB" stroke-width="2"/>
  </g>
  <text x="42" y="176" font-size="8.5" font-weight="800" fill="#8A6E62">第一章 · 作品预览</text>
  <g filter="url(#jsh2)">
    <rect x="286" y="160" width="62" height="20" rx="10" fill="#FFE9E6" stroke="#FF7568" stroke-width="1"/>
  </g>
  <text x="317" y="173.5" text-anchor="middle" font-size="8.5" font-weight="900" fill="#FF6B5C">拼片 3/12</text>

  <!-- 章节作品：真实资源（3/12 进度，与收藏/结算/章末同一张合成图 assets/reveal_03.png）
       插画区 30,154 330×288 = 程序 HomeRegionArts 实际尺寸；素材按容器比例从统一
       源画布裁切导出（比例严格一致）+ preserveAspectRatio="xMidYMid slice" 双保险，
       不做任何非等比拉伸；已揭晓 = full 对应源区；未揭晓 = silhouette，不泄露原图 -->
  <clipPath id="clipArtHome"><rect x="30" y="154" width="330" height="288" rx="20"/></clipPath>
  <g clip-path="url(#clipArtHome)">
    <image x="30" y="154" width="330" height="288" preserveAspectRatio="xMidYMid slice" xlink:href="assets/r03_330x288.png"/>
  </g>
  <!-- 未揭晓薄雾（程序 Mist 层，暖白 22%） -->
  <rect x="30" y="154" width="330" height="288" rx="20" fill="#FFF7EF" opacity=".22"/>

  <!-- ================= 唯一最强 CTA ================= -->
  <g filter="url(#jsh)">
    <rect x="24" y="468" width="342" height="88" rx="24" fill="url(#gcta)"/>
  </g>
  <rect x="46" y="490" width="44" height="44" rx="14" fill="#FFFFFF" opacity=".95"/>
  <use href="#arw-r" x="54" y="498" width="28" height="28" fill="#FF6B5C"/>
  <text class="ct1" x="106" y="512">继续第 4 关</text>
  <text class="ct2" x="106" y="530">第一章 · 甜点星球 · 已通关 3 关</text>
  <path d="M336 512l8 6-8 6z" fill="#FFFFFF" opacity=".9"/>

  <!-- ================= 进度卡：12 拼片节点 ================= -->
  <g filter="url(#jsh2)">
    <rect x="24" y="586" width="342" height="120" rx="20" fill="#FFFDF8" stroke="#F0DCCB" stroke-width="2"/>
  </g>
  <text class="cd1" x="42" y="612">第一章 · 甜点星球</text>
  <text x="348" y="611" text-anchor="end" font-size="9.5" font-weight="800" fill="#FF6B5C">查看收藏 ›</text>
  <!-- 进度条 3/12 -->
  <rect x="42" y="624" width="306" height="10" rx="5" fill="#F5E6D8"/>
  <rect x="42" y="624" width="76.5" height="10" rx="5" fill="#FF7568"/>
  <!-- 12 节点 -->
  <g>
    <circle cx="48" cy="656" r="6" fill="#FF7568"/><circle cx="48" cy="656" r="2.2" fill="#FFFFFF"/>
    <circle cx="74.8" cy="656" r="6" fill="#FF7568"/><circle cx="74.8" cy="656" r="2.2" fill="#FFFFFF"/>
    <circle cx="101.6" cy="656" r="6" fill="#FF7568"/><circle cx="101.6" cy="656" r="2.2" fill="#FFFFFF"/>
    <circle cx="128.4" cy="656" r="6" fill="#FFFDF8" stroke="#E8CDBB" stroke-width="1.5"/>
    <circle cx="155.2" cy="656" r="6" fill="#FFFDF8" stroke="#E8CDBB" stroke-width="1.5"/>
    <circle cx="182" cy="656" r="6" fill="#FFFDF8" stroke="#E8CDBB" stroke-width="1.5"/>
    <circle cx="208.8" cy="656" r="6" fill="#FFFDF8" stroke="#E8CDBB" stroke-width="1.5"/>
    <circle cx="235.6" cy="656" r="6" fill="#FFFDF8" stroke="#E8CDBB" stroke-width="1.5"/>
    <circle cx="262.4" cy="656" r="6" fill="#FFFDF8" stroke="#E8CDBB" stroke-width="1.5"/>
    <circle cx="289.2" cy="656" r="6" fill="#FFFDF8" stroke="#E8CDBB" stroke-width="1.5"/>
    <circle cx="316" cy="656" r="6" fill="#FFFDF8" stroke="#E8CDBB" stroke-width="1.5"/>
    <circle cx="342.8" cy="656" r="6" fill="#FFFDF8" stroke="#E8CDBB" stroke-width="1.5"/>
  </g>
  <text class="cd2" x="195" y="690" text-anchor="middle">拼片 3/12 · 还差 9 片解锁完整作品</text>

  <!-- ================= 底部三导航 ================= -->
  <g filter="url(#jsh)">
    <rect x="24" y="730" width="342" height="64" rx="22" fill="#FFFDF8" stroke="#F0DCCB" stroke-width="2"/>
  </g>
  <!-- 首页（激活） -->
  <use href="#ic-home" x="72" y="742" width="24" height="24" fill="#FF6B5C"/>
  <text class="nv" x="84" y="782" text-anchor="middle" fill="#FF6B5C">首页</text>
  <circle cx="84" cy="789" r="2" fill="#FF6B5C"/>
  <!-- 图鉴 -->
  <use href="#ic-book" x="183" y="742" width="24" height="24" fill="#B9A79B"/>
  <text class="nv" x="195" y="782" text-anchor="middle" fill="#8A7568">图鉴</text>
  <!-- 商店 -->
  <use href="#ic-bag" x="294" y="742" width="24" height="24" stroke="#B9A79B" fill="#B9A79B"/>
  <text class="nv" x="306" y="782" text-anchor="middle" fill="#8A7568">商店</text>

  <!-- 手机底部指示条（安全区） -->
  <rect x="128" y="826" width="134" height="5" rx="2.5" fill="#553B36" opacity=".2"/>
</svg>
