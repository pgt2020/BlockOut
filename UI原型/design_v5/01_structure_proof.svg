<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1120" width="780" height="2240" role="img" aria-label="BlockOut 结构校对图：6×6 棋盘，A-F 六块，每块一个箭头，HUD 剩余 6 块">
  <!-- ============================================================
       BlockOut · 游戏页结构校对图（带 A–F 标注）
       数据来源：玩法画法定稿规范.md §1 / 玩法画法样板.svg
       棋盘：6×6，格 62px，原点 (9,140)，行自上而下 y=5…0
       A L形(1,4)(1,3)(2,3) 箭头(2,3)→ 受阻(B/F)
       B 竖条(4,4)(4,3)     箭头(4,4)↑ 可飞
       C 横条(0,1)(1,1)(2,1) 箭头(1,1)← 可飞
       D 凹形(3,2)(5,2)(3,1)(4,1)(5,1) 箭头(4,1)↓ 可飞
       E 单格(0,4)          箭头(0,4)↑ 可飞
       F 竖条(2,5)(2,4)     箭头(2,5)→ 受阻(B)
       编辑说明：改方块只需改对应 path 的 d 值；箭头用 use 引用符号。
  ============================================================ -->
  <defs>
    <linearGradient id="pbg" x2="0" y2="1"><stop stop-color="#FFFAF4"/><stop offset="1" stop-color="#FFF1E3"/></linearGradient>
    <radialGradient id="bm"><stop stop-color="#62CFA7" stop-opacity=".16"/><stop offset="1" stop-color="#62CFA7" stop-opacity="0"/></radialGradient>
    <radialGradient id="bc"><stop stop-color="#FF7568" stop-opacity=".12"/><stop offset="1" stop-color="#FF7568" stop-opacity="0"/></radialGradient>
    <filter id="psh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#674138" flood-opacity=".16"/></filter>
    <filter id="pglow" x="-45%" y="-45%" width="190%" height="190%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#40C99B" flood-opacity=".85"/></filter>
    <symbol id="ar-r" viewBox="0 0 24 24"><path d="M20.5 12L9.5 20.5v-5.5h-6v-6h6V3.5z"/></symbol>
    <symbol id="ar-u" viewBox="0 0 24 24"><path d="M12 3.5l8.5 11h-5.5v6h-6v-6H3.5z"/></symbol>
    <symbol id="ar-l" viewBox="0 0 24 24"><path d="M3.5 12L14.5 3.5v5.5h6v6h-6v5.5z"/></symbol>
    <symbol id="ar-d" viewBox="0 0 24 24"><path d="M12 20.5L3.5 9.5h5.5v-6h6v6h5.5z"/></symbol>
    <path id="hrt" d="M12 20.5s-7.8-4.9-9.7-9.3C.7 7.6 2.8 4 6.4 4c2 0 3.7 1 5.6 3.1C13.9 5 15.6 4 17.6 4c3.6 0 5.7 3.6 4.1 7.2-1.9 4.4-9.7 9.3-9.7 9.3z"/>
    <symbol id="ic-home" viewBox="0 0 24 24"><path d="M12 3.5L21 11.2h-2.6v9.1h-4.2v-5.7h-4.4v5.7H5.6v-9.1H3z"/></symbol>
    <symbol id="ic-set" viewBox="0 0 24 24">
      <g fill="none" stroke-linecap="round">
        <path d="M3.5 7h17M3.5 12h17M3.5 17h17"/>
        <circle cx="9" cy="7" r="2.6" fill="#fff"/>
        <circle cx="15.5" cy="12" r="2.6" fill="#fff"/>
        <circle cx="7.5" cy="17" r="2.6" fill="#fff"/>
      </g>
    </symbol>
    <symbol id="ic-bulb" viewBox="0 0 24 24">
      <path d="M12 3a6 6 0 0 1 3.4 10.9c-.7.5-1 1.2-1 2.1h-4.8c0-.9-.3-1.6-1-2.1A6 6 0 0 1 12 3z"/>
      <path d="M9.8 18.5h4.4M10.5 21h3" fill="none"/>
    </symbol>
    <symbol id="ic-hammer" viewBox="0 0 24 24">
      <path d="M14.5 3.5l6 6-2.5 2.5-6-6z"/>
      <path d="M13 7l-8.5 8.5c-1 1-1 2.6 0 3.5s2.6 1 3.5 0L16.5 11" fill="none"/>
    </symbol>
    <symbol id="ic-refresh" viewBox="0 0 24 24">
      <path d="M20 12a8 8 0 1 1-2.4-5.7" fill="none"/>
      <path d="M20 3.5v4h-4" fill="none"/>
    </symbol>
    <style>
      text{font-family:'Microsoft YaHei','PingFang SC',Arial,sans-serif}
      .t1{font-size:18px;font-weight:700;fill:#553B36}
      .t2{font-size:10px;fill:#8A6E62}
      .pt{font-size:12px;font-weight:700;fill:#2E7C5B}
      .bd{font-size:12.5px;font-weight:900;fill:#553B36;text-anchor:middle;dominant-baseline:central}
      .bds{font-size:11.5px;font-weight:900;fill:#553B36;text-anchor:middle;dominant-baseline:central}
      .lg{font-size:10.5px;fill:#553B36}
      .hint{font-size:11px;fill:#8A6E62;text-anchor:middle}
      .tl{font-size:10.5px;fill:#553B36;text-anchor:middle}
      .sec{font-size:13.5px;font-weight:900;fill:#553B36}
      .th{font-size:10.5px;font-weight:700;fill:#8A6E62}
      .td{font-size:10.5px;fill:#553B36}
      .ok{font-size:10.5px;font-weight:700;fill:#2E7C5B}
      .grid{fill:none;stroke:#E9CFC0;stroke-width:1.5;stroke-dasharray:4 8}
      .arr{fill:#FFFEFA;stroke:#5A4038;stroke-width:1.4;paint-order:stroke fill;stroke-linejoin:round}
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="390" height="1120" fill="url(#pbg)"/>
  <circle cx="55" cy="130" r="150" fill="url(#bm)"/>
  <circle cx="345" cy="400" r="165" fill="url(#bc)"/>
  <circle cx="70" cy="780" r="150" fill="url(#bm)"/>

  <!-- ================= HUD 第一行：home / 关卡 / 设置 ================= -->
  <circle cx="46" cy="42" r="22" fill="#FFFFFF" filter="url(#psh)"/>
  <use href="#ic-home" x="36" y="32" width="20" height="20" fill="#553B36"/>
  <text class="t1" x="195" y="40" text-anchor="middle">第 12 关</text>
  <text class="t2" x="195" y="56" text-anchor="middle">甜点星球 · Dessert Planet</text>
  <circle cx="344" cy="42" r="22" fill="#FFFFFF" filter="url(#psh)"/>
  <use href="#ic-set" x="335" y="33" width="18" height="18" stroke="#553B36" stroke-width="2.2"/>

  <!-- ================= HUD 第二行：生命 / 剩余块数 ================= -->
  <rect x="24" y="72" width="96" height="30" rx="15" fill="#FFFFFF" filter="url(#psh)"/>
  <use href="#hrt" transform="translate(41.5,80.5) scale(0.5417)" fill="#F45F70"/>
  <use href="#hrt" transform="translate(63.5,80.5) scale(0.5417)" fill="#F45F70"/>
  <use href="#hrt" transform="translate(85.5,80.5) scale(0.5417)" fill="#F45F70"/>
  <rect x="256" y="72" width="110" height="30" rx="15" fill="#DFF6EC" stroke="#62CFA7" stroke-width="1.5"/>
  <rect x="267" y="80" width="9" height="9" rx="2.5" fill="#2E7C5B"/>
  <rect x="278" y="85" width="9" height="9" rx="2.5" fill="#FF7568"/>
  <text class="pt" x="294" y="91.5">剩余 6 块</text>

  <!-- ================= 棋盘 6×6（原点 9,140，格 62） ================= -->
  <rect x="9" y="140" width="372" height="372" rx="22" fill="#FFFDF8" stroke="#E8CDBB" stroke-width="3"/>
  <path class="grid" d="M71 140V512M133 140V512M195 140V512M257 140V512M319 140V512M9 202H381M9 264H381M9 326H381M9 388H381M9 450H381"/>

  <!-- A · L形三格 (1,4)(1,3)(2,3) · 箭头(2,3)向右 · 受阻(B/F) -->
  <path d="M71 202H133V264H195V326H71Z" fill="#F5BD84" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" filter="url(#psh)"/>
  <path d="M71 202H133V264H195V326H71Z" fill="none" stroke="#F45F70" stroke-width="4.5" stroke-linejoin="round"/>
  <use class="arr" href="#ar-r" x="152" y="283" width="24" height="24"/>

  <!-- B · 竖条两格 (4,4)(4,3) · 箭头(4,4)向上 · 可飞（教学焦点） -->
  <path d="M257 202H319V326H257Z" fill="#8ADBC0" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" filter="url(#psh)"/>
  <path d="M257 202H319V326H257Z" fill="none" stroke="#40C99B" stroke-width="4.5" stroke-linejoin="round" filter="url(#pglow)"/>
  <use class="arr" href="#ar-u" x="276" y="221" width="24" height="24"/>

  <!-- C · 横条三格 (0,1)(1,1)(2,1) · 箭头(1,1)向左 · 可飞 -->
  <path d="M9 388H195V450H9Z" fill="#B9A4E8" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" filter="url(#psh)"/>
  <path d="M9 388H195V450H9Z" fill="none" stroke="#40C99B" stroke-width="3" stroke-linejoin="round"/>
  <use class="arr" href="#ar-l" x="90" y="407" width="24" height="24"/>

  <!-- D · 凹形五格 (3,2)(5,2)(3,1)(4,1)(5,1) · 箭头(4,1)向下 · 可飞 -->
  <path d="M195 326H257V388H319V326H381V450H195Z" fill="#F6A4BA" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" filter="url(#psh)"/>
  <path d="M195 326H257V388H319V326H381V450H195Z" fill="none" stroke="#40C99B" stroke-width="3" stroke-linejoin="round"/>
  <use class="arr" href="#ar-d" x="276" y="407" width="24" height="24"/>

  <!-- E · 单格 (0,4) · 箭头(0,4)向上 · 可飞 -->
  <path d="M9 202H71V264H9Z" fill="#F7D36C" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" filter="url(#psh)"/>
  <path d="M9 202H71V264H9Z" fill="none" stroke="#40C99B" stroke-width="3" stroke-linejoin="round"/>
  <use class="arr" href="#ar-u" x="30" y="223" width="20" height="20"/>

  <!-- F · 竖条两格 (2,5)(2,4) · 箭头(2,5)向右 · 受阻(B) -->
  <path d="M133 140H195V264H133Z" fill="#92BBEF" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" filter="url(#psh)"/>
  <path d="M133 140H195V264H133Z" fill="none" stroke="#F45F70" stroke-width="4.5" stroke-linejoin="round"/>
  <use class="arr" href="#ar-r" x="152" y="159" width="24" height="24"/>

  <!-- A–F 校对标签（正式 UI 不显示） -->
  <circle cx="86" cy="218" r="10" fill="#FFFFFF" stroke="#F45F70" stroke-width="2"/><text class="bd" x="86" y="218">A</text>
  <circle cx="272" cy="308" r="10" fill="#FFFFFF" stroke="#40C99B" stroke-width="2"/><text class="bd" x="272" y="308">B</text>
  <circle cx="27" cy="404" r="10" fill="#FFFFFF" stroke="#40C99B" stroke-width="2"/><text class="bd" x="27" y="404">C</text>
  <circle cx="210" cy="404" r="10" fill="#FFFFFF" stroke="#40C99B" stroke-width="2"/><text class="bd" x="210" y="404">D</text>
  <circle cx="24" cy="212" r="9.5" fill="#FFFFFF" stroke="#40C99B" stroke-width="2"/><text class="bds" x="24" y="212">E</text>
  <circle cx="148" cy="218" r="10" fill="#FFFFFF" stroke="#F45F70" stroke-width="2"/><text class="bd" x="148" y="218">F</text>

  <!-- ================= 图例 + 提示 ================= -->
  <rect x="24" y="536" width="342" height="58" rx="16" fill="#FFFDF8" stroke="#F0DCCB" stroke-width="1.5"/>
  <line x1="42" y1="555" x2="66" y2="555" stroke="#40C99B" stroke-width="4" stroke-linecap="round"/>
  <text class="lg" x="74" y="559">可飞：B / C / D / E（B 为当前教学焦点）</text>
  <line x1="42" y1="577" x2="66" y2="577" stroke="#F45F70" stroke-width="4" stroke-linecap="round"/>
  <text class="lg" x="74" y="581">受阻：A 受 B、F 阻挡；F 受 B 阻挡</text>
  <text class="hint" x="195" y="620">轻点整块方块，沿箭头方向飞出</text>

  <!-- ================= 底部工具 ================= -->
  <rect x="24" y="636" width="342" height="104" rx="26" fill="#FFFDF8" stroke="#F0DCCB" stroke-width="2" filter="url(#psh)"/>
  <circle cx="97" cy="682" r="30" fill="#FFFFFF" filter="url(#psh)"/>
  <use href="#ic-bulb" x="85" y="670" width="24" height="24" fill="#553B36" stroke="#553B36" stroke-width="1.6"/>
  <circle cx="117" cy="662" r="10.5" fill="#FF7568"/>
  <text x="117" y="662" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="900" fill="#FFFFFF">2</text>
  <text class="tl" x="97" y="728">提示</text>
  <circle cx="195" cy="682" r="30" fill="#FFFFFF" filter="url(#psh)"/>
  <use href="#ic-hammer" x="183" y="670" width="24" height="24" fill="#553B36" stroke="#553B36" stroke-width="1.6"/>
  <circle cx="215" cy="662" r="10.5" fill="#FF7568"/>
  <text x="215" y="662" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="900" fill="#FFFFFF">2</text>
  <text class="tl" x="195" y="728">锤子</text>
  <circle cx="293" cy="682" r="30" fill="#FFFFFF" filter="url(#psh)"/>
  <use href="#ic-refresh" x="281" y="670" width="24" height="24" fill="none" stroke="#553B36" stroke-width="2.2"/>
  <circle cx="313" cy="662" r="10.5" fill="#FF7568"/>
  <text x="313" y="662" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="900" fill="#FFFFFF">1</text>
  <text class="tl" x="293" y="728">重排</text>

  <!-- 手机底部指示条 -->
  <rect x="128" y="800" width="134" height="5" rx="2.5" fill="#553B36" opacity=".2"/>

  <!-- ================= 校对区（非手机屏幕内容） ================= -->
  <line x1="24" y1="862" x2="366" y2="862" stroke="#E8CDBB" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text class="sec" x="24" y="890">逐块核对表</text>
  <text class="t2" x="24" y="908">对照《玩法画法定稿规范》§1 数据表 · 占格记为 (列x, 行y)，行自上而下 y=5…0</text>
  <text class="th" x="28" y="930">块</text>
  <text class="th" x="56" y="930">占格</text>
  <text class="th" x="205" y="930">唯一箭头</text>
  <text class="th" x="282" y="930">起始状态</text>
  <text class="th" x="364" y="930" text-anchor="end">核对</text>
  <text class="td" x="28" y="952">A</text><text class="td" x="56" y="952">(1,4)(1,3)(2,3)</text><text class="td" x="205" y="952">(2,3) 向右</text><text class="td" x="282" y="952">受阻（B、F）</text><text class="ok" x="364" y="952" text-anchor="end">✓</text>
  <text class="td" x="28" y="974">B</text><text class="td" x="56" y="974">(4,4)(4,3)</text><text class="td" x="205" y="974">(4,4) 向上</text><text class="td" x="282" y="974">可飞</text><text class="ok" x="364" y="974" text-anchor="end">✓</text>
  <text class="td" x="28" y="996">C</text><text class="td" x="56" y="996">(0,1)(1,1)(2,1)</text><text class="td" x="205" y="996">(1,1) 向左</text><text class="td" x="282" y="996">可飞</text><text class="ok" x="364" y="996" text-anchor="end">✓</text>
  <text class="td" x="28" y="1018">D</text><text class="td" x="56" y="1018">(3,2)(5,2)(3,1)(4,1)(5,1)</text><text class="td" x="205" y="1018">(4,1) 向下</text><text class="td" x="282" y="1018">可飞</text><text class="ok" x="364" y="1018" text-anchor="end">✓</text>
  <text class="td" x="28" y="1040">E</text><text class="td" x="56" y="1040">(0,4)</text><text class="td" x="205" y="1040">(0,4) 向上</text><text class="td" x="282" y="1040">可飞</text><text class="ok" x="364" y="1040" text-anchor="end">✓</text>
  <text class="td" x="28" y="1062">F</text><text class="td" x="56" y="1062">(2,5)(2,4)</text><text class="td" x="205" y="1062">(2,5) 向右</text><text class="td" x="282" y="1062">受阻（B）</text><text class="ok" x="364" y="1062" text-anchor="end">✓</text>
  <text class="td" x="28" y="1084">HUD</text><text class="td" x="56" y="1084">独立外轮廓总数 = 6</text><text class="td" x="205" y="1084">每块仅 1 枚</text><text class="td" x="282" y="1084">—</text><text class="ok" x="364" y="1084" text-anchor="end">剩余 6 块 ✓</text>
  <text class="t2" x="24" y="1108">A–F 为校对标签，正式 UI 不显示；本图 HUD / 棋盘 / 工具位置与高保真游戏页一致。</text>
</svg>
