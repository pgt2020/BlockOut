<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>首页</title>
    <style>
      body {
        margin: 0;
        background: #d8d2ca;
        font-family: "PingFang SC", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px;
        gap: 12px;
      }
      .note { max-width: 420px; font-size: 13px; line-height: 1.55; color: #4a3728; }
      .frame {
        width: min(390px, 100vw);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
        border-radius: 24px;
        overflow: hidden;
        background: #fff;
      }
      .frame img { width: 100%; display: block; height: auto; }
      nav a { margin: 0 8px; font-size: 13px; color: #1b6b5a; }
    </style>
  </head>
  <body>
    <p class="note">首页定稿 <code>clean_home</code>（拼片预览 + CTA）。</p>
    <nav>
      <a href="index.html">目录</a>
      <a href="game.html">对局</a>
      <a href="settlement.html">结算</a>
    </nav>
    <div class="frame">
      <img src="assets/clean_home.png" alt="首页" onerror="this.src='assets/clean_home.svg';this.onerror=null" />
    </div>
  </body>
</html>
