<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>INKROOM · BlockOut UI Concept</title>
<style>
:root{
  --paper:#F2EDE2; --sheet:#FBF8F0; --paper-deep:#E5DECD;
  --ink:#15171B; --ink2:#3D4047; --ink3:#6C6F76;
  --rule:#CFC7B6; --rule2:#A9A192;
  --verm:#D5432A; --cobal:#1F3FA8; --gold:#E3A518; --sage:#2F7D5B; --lilac:#7A5AA6;
  --serif: Georgia, "Times New Roman", "Songti SC", SimSun, serif;
  --sans: "Helvetica Neue", Arial, "Microsoft YaHei", sans-serif;
  --mono: "Courier New", Courier, monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#1B1D21; color:var(--paper); font-family:var(--sans);
  -webkit-font-smoothing:antialiased; padding:56px;
}
.board{width:1354px;margin:0 auto}

/* ---------- cover / spec ---------- */
.cover{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid #3A3D43;padding-bottom:28px;margin-bottom:36px}
.cover-kicker{font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:#8E9198;margin-bottom:14px}
.cover-title{font-family:var(--sans);font-size:46px;font-weight:800;letter-spacing:.18em;line-height:1}
.cover-title span{font-family:var(--serif);font-size:34px;font-weight:700;letter-spacing:.3em;color:var(--paper);margin-left:18px}
.cover-sub{margin-top:16px;font-size:13px;line-height:1.8;color:#A9ACB2;letter-spacing:.04em}
.cover-right{display:flex;gap:40px;align-items:flex-end}
.swatches{display:grid;grid-template-columns:repeat(6,44px);gap:8px}
.sw{height:44px;display:flex;flex-direction:column;justify-content:flex-end;padding:4px;font-family:var(--mono);font-size:7px;color:rgba(255,255,255,.82);letter-spacing:.04em}
.sw b{font-weight:400;opacity:.8}
.typespec{font-family:var(--mono);font-size:9px;line-height:1.9;letter-spacing:.1em;color:#8E9198;text-align:right}
.typespec em{font-family:var(--serif);font-size:28px;font-style:normal;color:var(--paper);display:block;letter-spacing:.06em;margin-bottom:4px}

/* ---------- board grid ---------- */
.grid{display:grid;grid-template-columns:repeat(3,390px);gap:56px 36px;justify-content:center}
.cell{width:390px}
figcaption{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:#8E9198}
figcaption b{color:var(--paper);font-weight:400}

/* ---------- phone ---------- */
.phone{position:relative;width:390px;height:844px;background:var(--paper);color:var(--ink);overflow:hidden;border:1px solid #4A4D53}
.phone:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:60;
  background-image:radial-gradient(rgba(21,23,27,.05) .5px, transparent .6px);background-size:3px 3px;opacity:.55}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}

/* status */
.status{height:40px;flex:0 0 40px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--ink2)}
.status .r{display:flex;align-items:center;gap:5px}
.bars{display:flex;align-items:flex-end;gap:1.5px;height:8px}
.bars i{width:2px;background:var(--ink);display:block}
.bars i:nth-child(1){height:3px}.bars i:nth-child(2){height:5px}.bars i:nth-child(3){height:7px}
.batt{width:16px;height:8px;border:1px solid var(--ink);position:relative}
.batt:after{content:"";position:absolute;inset:1px;right:3px;background:var(--ink)}

/* common */
.pad{padding:0 20px}
.topbar{height:50px;flex:0 0 50px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.icon-btn{width:38px;height:38px;border:1.5px solid var(--ink);background:var(--sheet);display:grid;place-items:center;flex:0 0 38px}
.icon-btn svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:square}
.topbar .mid{text-align:center;flex:1}
.eyebrow{font-family:var(--mono);font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink3)}
.topbar .mid .eyebrow{margin-bottom:3px}
.topbar .mid .tt{font-family:var(--serif);font-size:15px;font-weight:700;letter-spacing:.12em}
.coin{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em}
.coin .dot{width:10px;height:10px;border:1.5px solid var(--ink);border-radius:50%;position:relative}
.coin .dot:after{content:"";position:absolute;inset:2px;border:1px solid var(--ink);border-radius:50%}
.serif{font-family:var(--serif);font-weight:700}
.rule{height:1px;background:var(--rule);width:100%}
.rule-strong{height:1.5px;background:var(--ink);width:100%}
.mono{font-family:var(--mono)}

/* buttons */
.btn{height:58px;width:100%;background:var(--ink);color:var(--sheet);display:flex;align-items:center;justify-content:space-between;padding:0 18px;border:1.5px solid var(--ink);box-shadow:4px 4px 0 rgba(21,23,27,.22)}
.btn .txt{display:flex;flex-direction:column;gap:4px;text-align:left}
.btn .t{font-size:15px;font-weight:700;letter-spacing:.1em}
.btn .s{font-family:var(--mono);font-size:7.5px;letter-spacing:.22em;opacity:.55}
.btn .ar{font-size:20px;line-height:1;transform:translateY(-1px)}
.btn-ghost{height:46px;background:transparent;color:var(--ink);border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;letter-spacing:.1em}
.link{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--ink3);text-decoration:underline;text-underline-offset:4px}

/* art */
.art{background:var(--sheet);position:relative}
.art-dusk{background:
  radial-gradient(circle at 64% 24%, var(--gold) 0 7.2%, transparent 7.5%),
  linear-gradient(197deg, transparent 0 60%, #33503F 60.3% 100%),
  linear-gradient(163deg, transparent 0 67%, #5E7A61 67.3% 100%),
  linear-gradient(180deg,#F8EFDA 0 48%, #E9D5AC 48.2% 100%);}
.art-tide{background:
  radial-gradient(circle at 28% 25%, var(--gold) 0 8%, transparent 8.3%),
  repeating-linear-gradient(180deg, transparent 0 9px, rgba(242,237,226,.45) 9px 10px),
  linear-gradient(180deg, transparent 0 54%, var(--cobal) 54.4% 76%, #14265F 76.4% 100%),
  linear-gradient(180deg,#F2EDE2 0 54%, #DCD3C0 54.2% 100%);}
.art-bloom{background:
  radial-gradient(circle at 30% 38%, var(--verm) 0 7.2%, transparent 7.5%),
  radial-gradient(circle at 56% 27%, var(--lilac) 0 6.2%, transparent 6.5%),
  radial-gradient(circle at 72% 46%, var(--gold) 0 5.2%, transparent 5.5%),
  linear-gradient(90deg, transparent 0 47.8%, var(--sage) 48% 49.4%, transparent 49.6%),
  linear-gradient(90deg, transparent 0 60.8%, var(--sage) 61% 62.2%, transparent 62.4%),
  linear-gradient(180deg,#F2EDE2 0 72%, #DCD3C0 72.2% 100%);}
.art-night{background:
  radial-gradient(circle at 68% 25%, var(--gold) 0 10%, transparent 10.3%),
  radial-gradient(circle at 20% 18%, #F2EDE2 0 1px, transparent 1.4px),
  radial-gradient(circle at 36% 30%, #F2EDE2 0 1px, transparent 1.4px),
  radial-gradient(circle at 84% 40%, #F2EDE2 0 1px, transparent 1.4px),
  linear-gradient(180deg, var(--ink) 0 61%, #1F3FA8 61.4% 100%);}
.art-clay{background:
  radial-gradient(circle at 50% 92%, var(--paper) 0 21%, var(--gold) 21.3% 28%, transparent 28.3%),
  linear-gradient(90deg, transparent 0 26%, var(--verm) 26.2% 42%, transparent 42.2%),
  linear-gradient(90deg, transparent 0 62%, var(--lilac) 62.2% 76%, transparent 76.2%),
  linear-gradient(180deg,#E8D3A9 0 100%);}

/* print frame */
.print{position:relative;background:var(--sheet);border:1.5px solid var(--ink);box-shadow:6px 6px 0 rgba(21,23,27,.9);padding:7px}
.print .art{width:100%;height:100%;border:1px solid var(--ink)}
.frame-lbl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:7.5px;letter-spacing:.14em;color:var(--ink3);margin-top:6px}

/* fragments */
.frags{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);height:100%;position:relative;z-index:2}
.frag{background:transparent;border-right:3px solid var(--paper);border-bottom:3px solid var(--paper);position:relative}
.frag:nth-child(4n){border-right:0}
.frag:nth-child(n+9){border-bottom:0}
.frag.lock{background-color:var(--paper);background-image:repeating-linear-gradient(45deg,transparent 0 4px,rgba(21,23,27,.16) 4px 5px)}
.frag.lock:after{content:"";position:absolute;inset:8px;border:1px solid rgba(21,23,27,.14)}

/* nav */
.nav{position:absolute;left:0;right:0;bottom:0;height:64px;border-top:1.5px solid var(--ink);display:grid;grid-template-columns:repeat(4,1fr);background:var(--paper);z-index:5}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;letter-spacing:.14em;color:var(--ink3);text-decoration:none;position:relative}
.nav a+ a{border-left:1px solid var(--rule)}
.nav a svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5}
.nav a.on{background:var(--ink);color:var(--sheet)}
.nav a.on:after{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--gold)}

/* pills / tags */
.tag{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--ink);background:var(--sheet);font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;padding:4px 7px}
.tag.fill{background:var(--ink);color:var(--sheet)}
.tag.gold{background:var(--gold);color:var(--ink);border-color:var(--ink)}
.tag.cob{background:var(--cobal);color:var(--sheet);border-color:var(--cobal)}

/* crop marks */
.crop{position:absolute;width:10px;height:10px;border:0 solid var(--ink2);opacity:.5;z-index:2}
.crop.tl{top:56px;left:14px;border-left:1px solid;border-top:1px solid}
.crop.tr{top:56px;right:14px;border-right:1px solid;border-top:1px solid}
.crop.bl{bottom:14px;left:14px;border-left:1px solid;border-bottom:1px solid}
.crop.br{bottom:14px;right:14px;border-right:1px solid;border-bottom:1px solid}

/* ---------- S1 loading ---------- */
.load-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:40px}
.reg{position:absolute;top:38%;left:50%;width:210px;height:200px;transform:translate(-50%,-50%)}
.reg:before,.reg:after{content:"";position:absolute;background:var(--rule2)}
.reg:before{left:50%;top:0;bottom:0;width:1px}
.reg:after{top:50%;left:0;right:0;height:1px}
.reg i{position:absolute;border:1px solid var(--rule2);border-radius:50%;width:120px;height:120px;top:50%;left:50%;transform:translate(-50%,-50%)}
.load-card{position:relative;width:132px;height:172px;transform:rotate(-3.5deg);box-shadow:8px 8px 0 rgba(21,23,27,.9)}
.load-card .art{border:1.5px solid var(--ink)}
.load-card:before{content:"";position:absolute;inset:5px;border:1px solid rgba(242,237,226,.5);pointer-events:none}
.wordmark{font-size:27px;font-weight:800;letter-spacing:.34em;margin-top:38px;margin-left:.34em}
.zh{font-family:var(--serif);font-size:14px;letter-spacing:.62em;margin-top:8px;margin-left:.62em;color:var(--ink2)}
.load-rule{width:58px;height:1.5px;background:var(--ink);margin:22px 0 14px}
.load-state{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--ink3)}
.load-bar{display:flex;gap:3px;margin-top:12px}
.load-bar i{width:18px;height:5px;background:var(--rule);display:block}
.load-bar i.on{background:var(--ink)}
.load-foot{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:7.5px;letter-spacing:.22em;color:var(--ink3)}

/* ---------- S2 home ---------- */
.home-head{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 20px 0}
.brand{font-size:14px;font-weight:800;letter-spacing:.28em}
.brand span{display:block;font-family:var(--serif);font-weight:400;font-size:9px;letter-spacing:.5em;color:var(--ink3);margin-top:5px}
.home-actions{display:flex;align-items:center;gap:10px}
.title-row{display:flex;align-items:flex-end;justify-content:space-between;padding:22px 20px 14px}
.title-row h1{font-family:var(--serif);font-size:32px;line-height:1;letter-spacing:.06em}
.title-row .no{font-family:var(--mono);font-size:8px;letter-spacing:.18em;color:var(--ink3);text-align:right;line-height:1.7}
.hero{padding:0 20px;position:relative}
.hero .print{height:auto;padding:8px}
.hero .print .art{position:relative;overflow:hidden;height:250px}
.hero .tag{position:absolute;z-index:6}
.hero .tag.tl{top:18px;left:18px}
.hero .tag.tr{top:18px;right:18px}
.hero-cap{display:flex;align-items:center;justify-content:space-between;padding:10px 2px 0;border-top:1px solid var(--rule);margin-top:10px}
.hero-cap .nm{font-family:var(--serif);font-size:13px;letter-spacing:.08em}
.hero-cap .ed{font-family:var(--mono);font-size:8px;letter-spacing:.14em;color:var(--ink3)}
.home-cta{padding:20px 20px 0}
.home-cta .under{display:flex;justify-content:space-between;margin-top:9px;font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--ink3)}
.ledger{margin:18px 20px 0;border-top:1.5px solid var(--ink);border-bottom:1px solid var(--rule);padding:12px 0;display:grid;grid-template-columns:1fr 1fr;gap:0}
.ledger>div{padding:0 4px}
.ledger>div+div{border-left:1px solid var(--rule);padding-left:16px}
.ledger .k{font-family:var(--mono);font-size:8px;letter-spacing:.16em;color:var(--ink3);margin-bottom:6px}
.ledger .v{font-size:20px;font-weight:800;letter-spacing:.02em}
.ledger .v small{font-size:9px;font-weight:400;color:var(--ink3);margin-left:4px;letter-spacing:.1em}
.ticks{display:flex;gap:3px;margin-top:8px}
.ticks i{width:10px;height:4px;background:var(--rule);display:block}
.ticks i.on{background:var(--ink)}
.curator{margin:16px 20px 0;padding:2px 0 0 12px;border-left:2px solid var(--ink)}
.curator .k{font-family:var(--mono);font-size:8px;letter-spacing:.18em;color:var(--ink3)}
.curator p{font-family:var(--serif);font-size:12px;line-height:1.85;letter-spacing:.04em;margin-top:5px}
.curator .sig{font-family:var(--mono);font-size:7.5px;letter-spacing:.12em;color:var(--ink3);margin-top:6px;text-align:right}

/* ---------- S3 board ---------- */
.meta-row{display:flex;align-items:center;justify-content:space-between;padding:0 20px 12px;height:38px}
.hearts{display:flex;gap:3px;align-items:center}
.hearts svg{width:15px;height:15px;stroke:var(--ink);fill:var(--ink);stroke-width:1.3}
.hearts svg.empty{fill:none;stroke:var(--rule2)}
.hp-lbl{font-family:var(--mono);font-size:8px;letter-spacing:.16em;color:var(--ink3);margin-left:8px}
.remain{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:9px;letter-spacing:.1em}
.remain b{font-size:16px;font-weight:800;letter-spacing:0}
.board-wrap{padding:0 18px}
.board-frame{position:relative;background:var(--sheet);border:1.5px solid var(--ink);padding:9px;box-shadow:5px 5px 0 rgba(21,23,27,.14)}
.bgrid{display:grid;grid-template-columns:repeat(8,1fr);grid-auto-rows:39px;gap:3px}
.tile{position:relative;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden}
.tile:before{content:"";position:absolute;inset:3px;border:1px solid rgba(242,237,226,.28);pointer-events:none}
.tile.gold:before,.tile.paper:before{border-color:rgba(21,23,27,.22)}
.tile.c-verm{background:var(--verm)} .tile.c-cob{background:var(--cobal)}
.tile.c-gold{background:var(--gold)} .tile.c-sage{background:var(--sage)}
.tile.c-lilac{background:var(--lilac)} .tile.c-paper{background:#E9E1D0}
.tile .arw{width:46%;height:46%;stroke:var(--sheet);stroke-width:2.4;fill:none;stroke-linecap:square;position:relative;z-index:2}
.tile.c-gold .arw,.tile.c-paper .arw{stroke:var(--ink)}
.tile .arw.up{transform:rotate(0)} .tile .arw.right{transform:rotate(90deg)}
.tile .arw.down{transform:rotate(180deg)} .tile .arw.left{transform:rotate(-90deg)}
.tile.go:after{content:"";position:absolute;inset:3px;border:2px solid var(--sage);z-index:3}
.tile.go .tick{position:absolute;top:-1.5px;right:-1.5px;width:13px;height:13px;background:var(--sage);z-index:4;display:grid;place-items:center}
.tile.go .tick svg{width:8px;height:8px;stroke:var(--sheet);stroke-width:2.4;fill:none}
.tile.bad:after{content:"";position:absolute;inset:3px;border:2px solid var(--verm);z-index:3}
.tile.bad .cross{position:absolute;top:-1.5px;right:-1.5px;width:13px;height:13px;background:var(--verm);z-index:4;display:grid;place-items:center;font-family:var(--sans);font-size:9px;line-height:1;color:var(--sheet);font-weight:700}
.hint-line{display:flex;justify-content:space-between;align-items:center;padding:11px 20px 0;font-size:11px;letter-spacing:.06em;color:var(--ink3)}
.hint-line b{font-weight:700;color:var(--ink2)}
.toolbar{margin:14px 18px 0;border:1.5px solid var(--ink);display:grid;grid-template-columns:repeat(3,1fr);height:70px;background:var(--sheet)}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative}
.tool+.tool{border-left:1px solid var(--rule2)}
.tool svg{width:21px;height:21px;stroke:var(--ink);fill:none;stroke-width:1.4;stroke-linecap:square}
.tool .nm{font-size:10px;letter-spacing:.12em;color:var(--ink2)}
.tool .cnt{position:absolute;top:7px;right:10px;font-family:var(--mono);font-size:8px;font-weight:700;background:var(--ink);color:var(--sheet);padding:1px 4px;min-width:15px;text-align:center}
.tool.zero svg{stroke:var(--rule2)}
.tool.zero .nm{color:var(--rule2)}
.tool.zero .cnt{background:var(--rule2)}
.board-extra{display:flex;align-items:center;gap:11px;margin:12px 18px 0;border:1px solid var(--rule2);background:var(--sheet);padding:9px}
.board-extra .mini{width:50px;height:50px;border:1px solid var(--ink);flex:0 0 50px;position:relative;overflow:hidden}
.board-extra .mini .frags{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr)}
.board-extra .mini .frag{border-width:1px}
.board-extra .b{flex:1}
.board-extra .k{font-family:var(--mono);font-size:7.5px;letter-spacing:.14em;color:var(--ink3)}
.board-extra .t{font-size:11.5px;letter-spacing:.04em;margin-top:4px}
.board-extra .ticks{margin-top:6px}
.board-extra .ticks i{width:9px;height:3px}
.board-extra .be-num{font-family:var(--mono);font-size:19px;font-weight:700;letter-spacing:0}
.board-extra .be-num span{font-size:8px;color:var(--ink3);margin-left:2px}
.board-foot{position:absolute;bottom:18px;left:20px;right:20px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:8px;letter-spacing:.18em;color:var(--ink3)}

/* ---------- S4 settlement ---------- */
.settle{display:flex;flex-direction:column;height:100%;padding:0 20px}
.settle-top{display:flex;justify-content:space-between;align-items:center;height:50px}
.settle-title{text-align:center;margin-top:6px}
.settle-title .eyebrow{color:var(--sage);letter-spacing:.28em}
.settle-title h2{font-family:var(--serif);font-size:26px;letter-spacing:.1em;margin-top:8px}
.settle-art{position:relative;margin-top:20px;height:292px;padding:8px}
.settle-art .art{position:relative;overflow:hidden}
.grid-ov{position:absolute;inset:0;background-image:
  linear-gradient(to right, rgba(21,23,27,.18) 1px, transparent 1px),
  linear-gradient(to bottom, rgba(21,23,27,.18) 1px, transparent 1px);
  background-size:25% 33.333%;pointer-events:none;z-index:2}
.new-cell{position:absolute;left:50%;top:0;width:25%;height:33.333%;border:2.5px solid var(--gold);z-index:3}
.new-cell .tag{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:4}
.reward{display:flex;align-items:center;justify-content:space-between;margin-top:16px;border-top:1.5px solid var(--ink);border-bottom:1px solid var(--rule);padding:11px 2px}
.reward .l{display:flex;align-items:center;gap:9px;font-size:11px;letter-spacing:.06em}
.reward .l .coin{font-size:15px}
.reward .r{font-family:var(--mono);font-size:8px;letter-spacing:.16em;color:var(--ink3)}
.settle-prog{margin-top:12px}
.settle-prog .hd{display:flex;justify-content:space-between;font-family:var(--mono);font-size:8px;letter-spacing:.16em;color:var(--ink3);margin-bottom:7px}
.settle-prog .hd b{color:var(--ink);font-size:9px}
.settle-stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-top:14px;padding:10px 0}
.settle-stats>div+div{border-left:1px solid var(--rule);padding-left:14px}
