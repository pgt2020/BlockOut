<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:transparent;overflow:hidden}canvas{display:block}
</style></head><body>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from './vendor/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from './vendor/environments/RoomEnvironment.js';

const q = new URLSearchParams(location.search);
const COMP = q.get('c') || 'node_current';
const STATE = q.get('s') || 'current';
const W = parseInt(q.get('w') || '1024', 10);
const H = parseInt(q.get('h') || '1024', 10);

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.10;

const FOV = 14;
const FIT = parseFloat(q.get('fit') || '2.6');   // world width to frame
const camera = new THREE.PerspectiveCamera(FOV, W / H, 0.1, 120);
camera.position.z = Math.max(2, (FIT / 2) / Math.tan((FOV / 2) * Math.PI / 180)) + 0.6;

const key = new THREE.DirectionalLight(0xfff3e0, 0.72);
key.position.set(-4.5, 7, 9);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, {near:1, far:40, left:-6, right:6, top:6, bottom:-6});
key.shadow.bias = -0.0007;
key.shadow.radius = 5;
scene.add(key);
const fill = new THREE.DirectionalLight(0xd6ecff, 0.15);
fill.position.set(6, -3, 7);
scene.add(fill);
scene.add(new THREE.AmbientLight(0xffffff, 0.18));

const COLORS = {
  locked:   ['#a9a5a3', '#8f8d8b'],
  current:  ['#52c795', '#1f9e76'],
  star:     ['#b988de', '#a374c4'],
  fail:     ['#ef7458', '#cf503b'],
  challenge:['#ef7458', '#cf503b'],
  completed:['#6bcd9a', '#1f9e76'],
};

function shade(hex, k) {
  const c = new THREE.Color(hex); c.multiplyScalar(k);
  return '#' + c.getHexString();
}
function faceTexture(top, bot, opts={}) {
  const N = 512;
  const c = document.createElement('canvas'); c.width = c.height = N;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, N);
  grd.addColorStop(0.00, shade(top, 1.10));
  grd.addColorStop(0.45, top);
  grd.addColorStop(1.00, bot);
  g.fillStyle = grd; g.fillRect(0, 0, N, N);
  const sheen = g.createLinearGradient(0, 0, 0, N * 0.20);
  sheen.addColorStop(0, 'rgba(255,255,255,0.14)');
  sheen.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = sheen; g.fillRect(0, 0, N, N * 0.24);
  const dark = g.createLinearGradient(0, N * 0.62, 0, N);
  dark.addColorStop(0, 'rgba(0,0,0,0)');
  dark.addColorStop(1, 'rgba(0,0,0,0.34)');
  g.fillStyle = dark; g.fillRect(0, N * 0.62, N, N * 0.38);
  const rg = g.createRadialGradient(N*0.30, N*0.16, 8, N*0.30, N*0.16, N*0.42);
  rg.addColorStop(0, 'rgba(255,255,255,0.26)');
  rg.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = rg; g.fillRect(0, 0, N, N);
  if (opts.innerLine) {
    g.strokeStyle = 'rgba(255,255,255,0.55)';
    g.lineWidth = N * 0.012;
    g.strokeRect(N*0.035, N*0.035, N*0.93, N*0.93);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
const cream = (opts={}) => new THREE.MeshPhysicalMaterial(Object.assign({
  color: 0xf9e6bd, roughness: 0.88, metalness: 0.0,
  clearcoat: 0.0, clearcoatRoughness: 0.6,
}, opts));
const clay = (map, opts={}) => new THREE.MeshPhysicalMaterial(Object.assign({
  map, roughness: 0.58, metalness: 0.0, clearcoat: 0.05, clearcoatRoughness: 0.5,
}, opts));

function add(mesh, z=0, cast=true) {
  mesh.position.z = z; mesh.castShadow = cast; mesh.receiveShadow = true;
  scene.add(mesh); return mesh;
}

// ---- geometry helpers (design units are arbitrary; camera fixed) ----
const rbox = (w,h,d,r) => new RoundedBoxGeometry(w,h,d,8,r);

function makerNode(w=2.04, h=2.04) {
  const [top,bot] = COLORS[STATE] || COLORS.current;
  const rimW = w * 0.065;
  add(new THREE.Mesh(rbox(w, h, 0.44, Math.min(w,h)*0.235), cream()), 0);
  const fw = w - rimW*2;
  add(new THREE.Mesh(rbox(fw, fw, 0.34, fw*0.215), clay(faceTexture(top,bot))), 0.20);
}

function makerButton(w=3.2, h=1.34) {
  const r = h/2;
  add(new THREE.Mesh(rbox(w, h, 0.36, r*0.96), cream()), 0);
  // gold inner ring
  const gold = new THREE.MeshPhysicalMaterial({color:0xf0d9a0, roughness:0.7, metalness:0.0, clearcoat:0.1});
  add(new THREE.Mesh(rbox(w*0.955, h*0.90, 0.34, r*0.90), gold), 0.05, false);
  const [top,bot] = ['#57c274','#1f8f4b'];
  add(new THREE.Mesh(rbox(w*0.925, h*0.84, 0.32, r*0.82), clay(faceTexture(top,bot,{innerLine:true}))), 0.13);
}

function makerCapsule(w=3.2, h=1.06) {
  add(new THREE.Mesh(rbox(w, h, 0.40, h*0.48), cream()), 0);
}

function makerNav(w=6.6, h=1.74) {
  add(new THREE.Mesh(rbox(w, h, 0.42, h*0.30), cream()), 0);
}

function makerPlate(w=2.4, h=0.74) {
  add(new THREE.Mesh(rbox(w, h, 0.34, h*0.44), cream()), 0);
}

function makerCircle(d=1.3) {
  add(new THREE.Mesh(rbox(d, d, 0.36, d*0.49), cream()), 0);
}

function makerBubble(w=2.2, h=1.15) {
  add(new THREE.Mesh(rbox(w, h, 0.34, 0.34), cream()), 0);
}

function starShape(R, r) {
  const s = new THREE.Shape();
  for (let i=0;i<10;i++){
    const a = -Math.PI/2 + i*Math.PI/5;
    const rad = i%2===0 ? R : r;
    const x = Math.cos(a)*rad, y = Math.sin(a)*rad;
    i===0 ? s.moveTo(x,y) : s.lineTo(x,y);
  }
  s.closePath(); return s;
}

function makerBadgeStar(d=1.2) {
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(d*0.46, d*0.46, 0.18, 48), cream());
  disc.rotation.x = Math.PI/2; add(disc, 0);
  const inner = new THREE.Mesh(new THREE.CylinderGeometry(d*0.40, d*0.40, 0.20, 48),
    new THREE.MeshPhysicalMaterial({color:0x9f6cd6, roughness:0.45, clearcoat:0.5}));
  inner.rotation.x = Math.PI/2; add(inner, 0.06);
  const star = new THREE.Mesh(new THREE.ExtrudeGeometry(starShape(d*0.24, d*0.105), {depth:0.07, bevelEnabled:true, bevelSize:0.02, bevelThickness:0.02, bevelSegments:2}),
    new THREE.MeshPhysicalMaterial({color:0xfffdf6, roughness:0.42, clearcoat:0.5}));
  add(star, 0.14);
}

function makerBadgeLock(d=1.2) {
  const body = new THREE.Mesh(rbox(d*0.66, d*0.54, 0.24, d*0.13),
    new THREE.MeshPhysicalMaterial({color:0x9d9a97, roughness:0.35, metalness:0.30, clearcoat:0.5}));
  add(body, 0.02);
  const sh = new THREE.Mesh(new THREE.TorusGeometry(d*0.20, d*0.055, 12, 32, Math.PI),
    new THREE.MeshPhysicalMaterial({color:0xfdf8ec, roughness:0.4, clearcoat:0.4}));
  sh.position.y = d*0.24; add(sh, 0.02);
  const kh = new THREE.Mesh(new THREE.CylinderGeometry(d*0.05, d*0.05, 0.24, 20),
    new THREE.MeshPhysicalMaterial({color:0xfffdf6, roughness:0.4}));
  kh.rotation.x = Math.PI/2; kh.position.y = -d*0.02; add(kh, 0.10, false);
}

function skullTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.clearRect(0,0,256,256);
  g.fillStyle = '#fdf8ec';
  g.beginPath(); g.ellipse(128, 112, 82, 88, 0, 0, Math.PI*2); g.fill();
  g.beginPath();
  g.moveTo(104, 176); g.lineTo(152, 176);
  g.quadraticCurveTo(164, 176, 164, 190); g.lineTo(164, 208);
  g.quadraticCurveTo(164, 222, 150, 222); g.lineTo(106, 222);
  g.quadraticCurveTo(92, 222, 92, 208); g.lineTo(92, 190);
  g.quadraticCurveTo(92, 176, 104, 176); g.closePath(); g.fill();
  g.fillStyle = '#4a3a2e';
  g.beginPath(); g.ellipse(100, 108, 22, 26, 0, 0, Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(156, 108, 22, 26, 0, 0, Math.PI*2); g.fill();
  g.beginPath(); g.moveTo(128,140); g.lineTo(118,160); g.lineTo(138,160); g.closePath(); g.fill();
  for (let i=-1;i<=1;i++) { g.fillRect(128 + i*20 - 3, 196, 6, 22); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function makerBadgeSkull(d=1.2) {
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(d*0.46, d*0.46, 0.18, 48), cream());
  disc.rotation.x = Math.PI/2; add(disc, 0);
  const inner = new THREE.Mesh(new THREE.CylinderGeometry(d*0.40, d*0.40, 0.20, 48),
    new THREE.MeshPhysicalMaterial({color:0xf3ecdc, roughness:0.6}));
  inner.rotation.x = Math.PI/2; add(inner, 0.06);
  const face = new THREE.Mesh(new THREE.PlaneGeometry(d*0.62, d*0.62),
    new THREE.MeshBasicMaterial({map: skullTexture(), transparent:true}));
  add(face, 0.21, false);
}

function makerBadgePlus(d=1.1) {
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(d*0.44, d*0.44, 0.20, 48), cream());
  disc.rotation.x = Math.PI/2; add(disc, 0);
  const inner = new THREE.Mesh(new THREE.CylinderGeometry(d*0.37, d*0.37, 0.22, 48),
    new THREE.MeshPhysicalMaterial({color:0x49bd6f, roughness:0.45, clearcoat:0.5}));
  inner.rotation.x = Math.PI/2; add(inner, 0.07);
  const mat = new THREE.MeshPhysicalMaterial({color:0xfffdf6, roughness:0.4, clearcoat:0.5});
  const a = new THREE.Mesh(rbox(d*0.44, d*0.13, 0.08, d*0.06), mat); add(a, 0.14, false);
  const b = new THREE.Mesh(rbox(d*0.13, d*0.44, 0.08, d*0.06), mat); add(b, 0.14, false);
}

function makerDot(d=0.9) {
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(d*0.46, d*0.46, 0.18, 40), cream());
  disc.rotation.x = Math.PI/2; add(disc, 0);
  const inner = new THREE.Mesh(new THREE.CylinderGeometry(d*0.36, d*0.36, 0.20, 40),
    new THREE.MeshPhysicalMaterial({color:0xef5f50, roughness:0.45, clearcoat:0.5}));
  inner.rotation.x = Math.PI/2; add(inner, 0.06);
}

const MAKERS = {
  node: makerNode, node_current: () => makerNode(),
  btn_primary: makerButton, capsule: makerCapsule, nav_bar: makerNav,
  plate_label: makerPlate, circle_button: makerCircle, bubble: makerBubble,
  badge_star: makerBadgeStar, badge_lock: makerBadgeLock, badge_skull: makerBadgeSkull,
  badge_plus: makerBadgePlus, badge_alert: makerDot,
};
(MAKERS[COMP] || makerNode)();

// ground shadow catcher
const catcher = new THREE.Mesh(new THREE.PlaneGeometry(30, 30),
  new THREE.ShadowMaterial({color:0x1d2a18, opacity:0.16}));
catcher.position.z = -0.30; catcher.receiveShadow = true; scene.add(catcher);

renderer.render(scene, camera);
window.__done = true;
</script>
</body></html>
