<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>BlockOut · 对局页</title>
<style>
  @font-face{
    font-family:'NotoSC';
    src:url('fonts/NotoSansSC-VF.ttf') format('truetype-variations');
    font-weight:100 900;
  }
  html,body{margin:0;padding:0;background:#F6E8D2;overflow:hidden;}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;}
  canvas{position:absolute;left:0;top:0;width:1080px;height:1920px;display:block;}
  #labels{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none;}
  .lb{
    position:absolute;transform:translate(-50%,-50%);
    font-family:'NotoSC',sans-serif;
    color:#3B2A24;white-space:nowrap;
    font-variant-numeric:tabular-nums;
    line-height:1;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="labels"></div>
</div>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module" src="scene.js"></script>
</body>
</html>
